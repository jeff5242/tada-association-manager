<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會務相關｜TADA 台灣科技農企業發展協會</title>
<meta name="description" content="TADA 會務服務：繳費回報、聯絡秘書處。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--forest:#1a3320;--fern:#2d5235;--gold:#c4922a;--gold-lt:#e8b84b;--rice:#f8f4ea;--gray:#6b8272;--border:#dde8e0;--ink:#1a2e1e}
body{font-family:'Noto Sans TC',sans-serif;background:var(--rice);color:var(--ink);line-height:1.8;min-height:100vh}
.hero{background:linear-gradient(160deg,#1f3d26,#14251a);padding:40px 24px 32px;text-align:center;border-bottom:3px solid var(--gold)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:900;color:#fff;letter-spacing:.1em}
.hero p{font-size:13px;color:rgba(255,255,255,.65);margin-top:4px;letter-spacing:.05em}
.wrap{max-width:480px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 14px}
.card-h .ic{font-size:34px}
.card-h .t{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:900;color:var(--forest)}
.card-h .s{font-size:12px;color:var(--gray)}
.card-b{padding:0 20px 20px;font-size:13.5px;color:#3a4e3e}
.btn{display:block;text-align:center;padding:14px;margin-top:12px;border-radius:8px;text-decoration:none;font-size:16px;font-weight:700;letter-spacing:.08em}
.btn.gold{background:var(--gold);color:#1a1a12}
.btn.dark{background:var(--forest);color:var(--gold-lt)}
.btn.line{background:#f2f6f2;color:var(--fern);border:1px solid var(--border);font-weight:500;font-size:14px}
.contact-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.contact-row:last-of-type{border-bottom:none}
.contact-row b{color:var(--forest)}
.foot{text-align:center;font-size:11.5px;color:var(--gray);margin-top:8px}
.foot a{color:var(--gray)}
</style>
</head>
<body>

<div class="hero">
  <h1>會務相關</h1>
  <p>台灣科技農企業發展協會 秘書處</p>
</div>

<div class="wrap">

  <div class="card">
    <div class="card-h"><span class="ic">🏦</span><div><div class="t">繳費回報</div><div class="s">會費匯款後回報，加速對帳與開立證明</div></div></div>
    <div class="card-b">
      完成會費繳納後，請點下方按鈕填寫繳費資料（金額、匯款日期、帳號後五碼；現場繳現金者由秘書處代填）。核帳完成後將寄送繳費確認證明。
      <a class="btn gold" href="https://liff.line.me/2010670397-aJlbduya">前往繳費回報</a>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><span class="ic">📞</span><div><div class="t">聯絡秘書</div><div class="s">會籍、繳費、活動等會務事項洽詢</div></div></div>
    <div class="card-b">
      <div class="contact-row"><span>秘書長</span><b>陳雅琳</b></div>
      <div class="contact-row"><span>電話</span><b>0988-558-246</b></div>
      <div class="contact-row"><span>E-mail</span><b>service@tada-ai.org.tw</b></div>
      <a class="btn dark" href="tel:0988558246">📱 撥打電話</a>
      <a class="btn line" href="mailto:service@tada-ai.org.tw">✉ 寫信給秘書處</a>
      <a class="btn line" href="https://line.me/R/oaMessage/@tada-ai/">💬 在 LINE 官方帳號留言</a>
    </div>
  </div>

  <div class="foot">台灣科技農企業發展協會（TADA）<br><a href="https://tada-ai.org.tw/">tada-ai.org.tw</a></div>

</div>

</body>
</html>
