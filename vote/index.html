<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>理監事選舉投票｜TADA</title>
<script src="../assets/liff-common.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a14;--gold:#b8913a;--gold-light:#d4a853;--green-deep:#1e3320;--green-mid:#2d5235;--green-light:#5a8a60;--cream:#f8f4ea;--line:#e5ddc8;--red:#c0392b;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:0 0 40px;}
.top-bar{height:4px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px;}
.head{text-align:center;margin-bottom:16px;}
.kick{font-size:11px;letter-spacing:0.3em;color:var(--gold);font-weight:600;margin-bottom:6px;}
.title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;color:var(--green-deep);line-height:1.35;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(30,51,32,0.05);}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 12px;}
.sec-title b{font-family:'Noto Serif TC',serif;font-size:17px;color:var(--green-deep);}
.sec-title .rule{font-size:11px;color:var(--green-light);font-weight:400;margin-left:6px;}
.counter{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap;}
.counter.full{color:var(--red);}
.opt{display:flex;align-items:center;gap:11px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:all .12s;background:#fff;}
.opt.sel{border-color:var(--green-mid);background:rgba(45,82,53,0.06);}
.opt .box{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;}
.opt.sel .box{background:var(--green-mid);border-color:var(--green-mid);}
.opt .no{font-size:12px;color:var(--green-light);width:20px;text-align:center;flex-shrink:0;}
.opt .nm{font-size:16px;font-weight:700;color:var(--green-deep);}
.opt .co{font-size:12px;color:var(--green-light);margin-top:1px;}
.opt.disabled{opacity:.4;}
.submit{width:100%;padding:16px;font-size:17px;font-weight:700;font-family:inherit;background:var(--green-deep);color:var(--gold-light);border:none;border-radius:8px;cursor:pointer;letter-spacing:0.1em;}
.submit:disabled{opacity:.5;}
.hint{font-size:12px;color:var(--green-light);}
.state{text-align:center;padding:64px 24px;}
.state .ic{font-size:56px;margin-bottom:16px;}
.state .msg{font-size:19px;color:var(--green-deep);font-weight:700;line-height:1.7;}
.state .sub2{font-size:13px;color:var(--green-light);margin-top:12px;line-height:1.9;}
.loading{text-align:center;padding:80px 20px;color:var(--green-light);font-size:14px;}
.err{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);color:var(--red);font-size:13px;padding:12px;border-radius:8px;margin-bottom:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="wrap">
  <div id="loading" class="loading">載入選票… 🐝</div>

  <div id="ballot-view" style="display:none;">
    <div class="head">
      <div class="kick">TADA 理監事選舉</div>
      <div class="title" id="v-title">圈選您支持的候選人</div>
    </div>
    <div id="ballot-err"></div>

    <div class="card" id="card-director">
      <div class="sec-title">
        <b>理事票 <span class="rule" id="d-rule"></span></b>
        <span class="counter" id="d-count"></span>
      </div>
      <div id="director-list"></div>
    </div>

    <div class="card" id="card-supervisor">
      <div class="sec-title">
        <b>監事票 <span class="rule" id="s-rule"></span></b>
        <span class="counter" id="s-count"></span>
      </div>
      <div id="supervisor-list"></div>
    </div>

    <button class="submit" id="submit-btn" onclick="castBallot()">送出選票</button>
    <div class="hint" style="text-align:center;margin-top:10px;">⚠️ 選票一經送出即完成投票、無法更改或重投，請確認後再送出。</div>
  </div>

  <div id="done-view" class="state" style="display:none;">
    <div class="ic" id="done-ic">🗳️</div>
    <div class="msg" id="done-msg"></div>
    <div class="sub2" id="done-sub"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t');
let election = null;
const pick = { director: 0, supervisor: 0 };
const chosen = { director: new Set(), supervisor: new Set() };

function showErr(id, m){ document.getElementById(id).innerHTML = m ? '<div class="err">'+m+'</div>' : ''; }
function statePage(ic, msg, sub){
  ['ballot-view','loading'].forEach(x=>document.getElementById(x).style.display='none');
  document.getElementById('done-ic').textContent = ic;
  document.getElementById('done-msg').textContent = msg;
  document.getElementById('done-sub').innerHTML = sub || '';
  document.getElementById('done-view').style.display = 'block';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function rpc(fn, body){
  const res = await fetch(`${window.TADA_SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST', headers: window.tadaSbHeaders(), body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()));
  return res.json();
}

async function init(){
  if(!TOKEN){ statePage('📷','請掃描領票單上的 QR Code','由現場報到處領取選票後，以手機掃描 QR Code 即可進入投票。'); return; }
  try{
    const r = await rpc('vote_ballot', { p_uuid: TOKEN });
    document.getElementById('loading').style.display='none';
    if(!r.ok){
      if(r.error==='used'){ statePage('✅','這張選票已完成投票','一張選票僅能使用一次，感謝您的參與。'); }
      else if(r.error==='invalid'){ statePage('⚠️','選票無效','查無此選票，請洽現場工作人員確認。'); }
      else if(r.error==='not_open'){ statePage('🕐','投票尚未開放或已截止','請依現場宣布時間投票。'); }
      else { statePage('⚠️','無法載入選票', r.error); }
      return;
    }
    election = r.election;
    pick.director = election.director_pick;
    pick.supervisor = election.supervisor_pick;
    const dcands = r.candidates.filter(c=>c.position==='director');
    const scands = r.candidates.filter(c=>c.position==='supervisor');
    document.getElementById('v-title').textContent = election.title;
    document.getElementById('d-rule').textContent = `應選 ${election.director_seats} 席・限圈選 ${pick.director} 人`;
    document.getElementById('s-rule').textContent = `應選 ${election.supervisor_seats} 席・限圈選 ${pick.supervisor} 人`;
    if(!dcands.length) document.getElementById('card-director').style.display='none';
    if(!scands.length) document.getElementById('card-supervisor').style.display='none';
    renderList('director', dcands, 'director-list');
    renderList('supervisor', scands, 'supervisor-list');
    updateCounter('director'); updateCounter('supervisor');
    document.getElementById('ballot-view').style.display='block';
  }catch(e){
    document.getElementById('loading').textContent = '載入失敗，請重新掃描 QR Code 或洽工作人員。';
  }
}

function renderList(cat, arr, elId){
  document.getElementById(elId).innerHTML = arr.map(c=>`
    <div class="opt" data-cat="${cat}" data-id="${c.id}" onclick="toggle('${cat}','${c.id}')">
      <div class="box">✓</div>
      <div class="no">${c.no||''}</div>
      <div><div class="nm">${escapeHtml(c.name)}</div>${c.company?`<div class="co">${escapeHtml(c.company)}</div>`:''}</div>
    </div>`).join('');
}

function toggle(cat, id){
  const set = chosen[cat];
  if(set.has(id)) set.delete(id);
  else { if(set.size >= pick[cat]) return; set.add(id); }
  document.querySelectorAll(`.opt[data-cat="${cat}"]`).forEach(el=>{
    const sel = set.has(el.dataset.id);
    el.classList.toggle('sel', sel);
    el.classList.toggle('disabled', !sel && set.size >= pick[cat]);
  });
  updateCounter(cat);
}

function updateCounter(cat){
  const set = chosen[cat];
  const cEl = document.getElementById(cat==='director'?'d-count':'s-count');
  cEl.textContent = `已選 ${set.size} / ${pick[cat]}`;
  cEl.classList.toggle('full', set.size >= pick[cat]);
}

async function castBallot(){
  const dn = chosen.director.size, sn = chosen.supervisor.size;
  if(dn === 0 && sn === 0){
    if(!confirm('您尚未圈選任何候選人，確定投空白票？')) return;
  } else if(!confirm(`確定送出？理事 ${dn} 位、監事 ${sn} 位。送出後無法更改。`)){ return; }
  const btn = document.getElementById('submit-btn'); btn.disabled=true; btn.textContent='送出中…';
  try{
    const r = await rpc('vote_cast', {
      p_uuid: TOKEN,
      p_directors: [...chosen.director],
      p_supervisors: [...chosen.supervisor],
      p_executives: [],
    });
    if(r.ok){
      statePage('🎉','投票完成，感謝您！', `理事 ${dn} 位、監事 ${sn} 位已送出。<br>開票結果將於現場宣布。`);
    } else if(r.error==='already_voted'){ statePage('✅','這張選票已完成投票','一張選票僅能使用一次。');
    } else if(r.error==='not_open'){ showErr('ballot-err','投票已截止。'); btn.disabled=false; btn.textContent='送出選票';
    } else if(r.error==='invalid_token'){ statePage('⚠️','選票無效','請洽現場工作人員。');
    } else { showErr('ballot-err','送出失敗（'+r.error+'），請洽工作人員。'); btn.disabled=false; btn.textContent='送出選票'; }
  }catch(e){ showErr('ballot-err','送出失敗：'+e.message); btn.disabled=false; btn.textContent='送出選票'; }
}

init();
</script>
</body>
</html>
