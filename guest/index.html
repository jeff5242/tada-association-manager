<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>貴賓報到｜TADA</title>
<script src="../assets/liff-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --green-deep:#12241a; --green:#1e3320; --green-2:#2c4a32;
  --gold:#c4922a; --gold-lt:#e0b458; --cream:#f5ecd4; --paper:#f8f4ea;
  --ink:#20261f; --muted:#8a9184;
  --serif:'Noto Serif TC',"Songti TC",serif;
  --sans:'Noto Sans TC',"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:
  radial-gradient(120% 80% at 50% -10%, #24402b 0%, var(--green-deep) 55%);
  color:var(--cream);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;}

/* Header */
header{display:flex;align-items:center;gap:18px;padding:20px 34px;border-bottom:1px solid rgba(196,146,42,.28);flex:none;}
header .logo{height:44px}
header .h-title{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--gold-lt);letter-spacing:.14em}
header .h-sub{font-size:13px;color:var(--muted);margin-top:2px;letter-spacing:.06em}
header .prog{margin-left:auto;text-align:right}
header .prog .n{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--cream);line-height:1}
header .prog .n b{color:var(--gold-lt)}
header .prog .l{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.add-btn{margin-left:22px;background:var(--gold);border:none;color:#1a1a12;border-radius:12px;height:52px;padding:0 22px;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;flex:none}
.add-btn:active{transform:scale(.96)}
.fs-btn{margin-left:12px;background:rgba(255,255,255,.06);border:1px solid rgba(196,146,42,.35);color:var(--gold-lt);border-radius:12px;width:56px;height:52px;font-size:24px;cursor:pointer;flex:none}
.fs-btn:active{transform:scale(.94)}
/* 新增貴賓 Modal */
.addcard{background:radial-gradient(120% 120% at 50% 0%, #2c4a32, #15281c);border:1px solid var(--gold);border-radius:22px;padding:36px 40px;max-width:520px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.add-h{font-family:var(--serif);font-size:28px;font-weight:900;color:var(--gold-lt);text-align:center}
.add-sub{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 22px}
.add-lb{display:block;font-size:14px;color:var(--gold-lt);margin:14px 0 6px;font-weight:700}
.add-in{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(196,146,42,.3);border-radius:12px;padding:15px 16px;color:var(--cream);font-size:19px;font-family:inherit;outline:none}
.add-cats{display:flex;flex-wrap:wrap;gap:8px}
.ag-cat{background:rgba(255,255,255,.05);border:1px solid rgba(196,146,42,.3);color:var(--cream);border-radius:99px;padding:10px 16px;font-size:15px;font-family:inherit;cursor:pointer}
.ag-cat.on{background:var(--gold);color:#1a1a12;border-color:var(--gold);font-weight:700}
.add-btns{display:flex;gap:12px;margin-top:26px}
.add-cancel{flex:0 0 auto;background:transparent;border:1px solid rgba(245,236,212,.3);color:var(--cream);border-radius:12px;padding:15px 24px;font-size:17px;font-family:inherit;cursor:pointer}
.add-ok{flex:1;background:var(--gold);border:none;color:#1a1a12;border-radius:12px;padding:15px;font-size:19px;font-weight:900;font-family:inherit;cursor:pointer}
.add-err{color:#f0a;font-size:14px;text-align:center;margin-top:12px;min-height:18px}
/* 掃碼報到 QR */
.qrcard{background:#15281c;border:1px solid var(--gold);border-radius:22px;padding:34px 40px;text-align:center;max-width:460px}
.qr-h{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--gold-lt)}
.qr-sub{font-size:15px;color:var(--muted);line-height:1.7;margin:12px 0 22px}
#qrbox{background:#fff;padding:16px;border-radius:16px;display:inline-block;line-height:0}
#qrbox img{display:block}
.qr-close{margin-top:24px;background:transparent;border:1px solid rgba(245,236,212,.3);color:var(--cream);border-radius:12px;padding:14px 40px;font-size:17px;font-family:inherit;cursor:pointer}
/* 設定 */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-top:1px solid rgba(196,146,42,.18);cursor:pointer}
.set-row span{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--cream)}
.set-row span small{font-size:12px;color:var(--muted)}
.set-row input{width:26px;height:26px;accent-color:var(--gold);flex:none}
.gcard.viewonly{opacity:.9}
.g-wait{margin-top:auto;text-align:center;color:var(--muted);font-size:15px;padding:14px;border:1px dashed rgba(196,146,42,.25);border-radius:12px}

/* Top: 兩排過濾（各一行，可左右滑，不折行）*/
.top{flex:0 0 auto;padding:12px 0 8px;}
.filter-row{display:flex;align-items:center;gap:14px;padding:5px 34px}
.fr-label{flex:0 0 auto;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.18em;width:34px}
.units{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:10px;flex:1;min-width:0;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.unit{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(196,146,42,.25);border-radius:12px;padding:10px 18px;cursor:pointer;transition:all .12s;display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.unit:active{transform:scale(.96)}
.unit.on{background:linear-gradient(160deg,var(--gold),#a8791f);border-color:var(--gold-lt)}
.unit .u-name{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--cream);line-height:1.1}
.unit.on .u-name{color:#1a1a12}
.unit .u-cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit.on .u-cnt{color:rgba(26,26,18,.72)}
.unit .u-cnt b{color:var(--gold-lt)}
.unit.on .u-cnt b{color:#3a2e08}
.cats .unit.cat{padding:11px 22px}
.cats .unit.cat .u-name{font-size:21px}
.cats .unit.cat.on{background:linear-gradient(160deg,#2c4a32,#1a3020);border-color:var(--gold-lt)}
.cats .unit.cat.on .u-name{color:var(--gold-lt)}
.cats .unit.cat.on .u-cnt,.cats .unit.cat.on .u-cnt b{color:var(--cream)}

/* Bottom: guest list（更多高度、字更大、無搜尋）*/
.bottom{flex:1;min-height:0;overflow-y:auto;padding:10px 34px 40px;background:rgba(0,0,0,.16);border-top:1px solid rgba(196,146,42,.18);-webkit-overflow-scrolling:touch}
.bottom-head{position:sticky;top:0;background:linear-gradient(180deg,#132619 72%,transparent);padding:12px 0;z-index:2}
.bottom-head .bh-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--gold-lt)}
.guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.gcard{position:relative;background:linear-gradient(160deg,#25412c,#182c1f);border:1px solid rgba(196,146,42,.28);border-radius:16px;padding:24px 26px;display:flex;flex-direction:column;gap:18px;transition:all .12s}
.g-reset{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.05);border:1px solid rgba(238,136,136,.4);color:#e69a9a;font-size:12px;font-family:var(--sans);border-radius:8px;padding:5px 10px;cursor:pointer;z-index:3;opacity:.85}
.g-reset:active{transform:scale(.94)}
.gcard:active{transform:scale(.98)}
.gcard .g-name{font-family:var(--serif);font-size:32px;font-weight:900;color:var(--cream);line-height:1.15}
.gcard .g-org{font-size:15px;color:var(--muted);margin-top:4px}
.gcard .g-btn{margin-top:auto;background:var(--gold);color:#1a1a12;border:none;border-radius:12px;padding:18px;font-size:22px;font-weight:900;font-family:inherit;letter-spacing:.06em;cursor:pointer}
.gcard.done{opacity:.6;border-color:rgba(102,187,106,.4)}
.gcard.done .g-done{margin-top:auto;text-align:center;background:rgba(102,187,106,.14);border:1px solid rgba(102,187,106,.4);border-radius:12px;padding:17px;font-size:19px;font-weight:700;color:#9be0a3}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:20px}

/* Welcome overlay */
.overlay{position:fixed;inset:0;background:rgba(8,16,10,.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:40px}
.overlay.show{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wcard{position:relative;background:radial-gradient(120% 120% at 50% 0%, #2c4a32, #15281c);border:1px solid var(--gold);border-radius:28px;padding:48px 60px;text-align:center;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,.8,.3,1.2)}
.wcard .w-x{position:absolute;top:16px;right:20px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(245,236,212,.3);color:var(--cream);font-size:22px;cursor:pointer}
.wcard .w-x:active{transform:scale(.92)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.wcard .w-hi{font-size:16px;letter-spacing:.4em;color:var(--gold-lt);font-weight:700;margin-bottom:18px}
.wcard .w-name{font-family:var(--serif);font-size:56px;font-weight:900;color:var(--cream);line-height:1.1}
.wcard .w-org{font-size:19px;color:var(--gold-lt);margin-top:10px}
.wcard .w-seat{margin:30px auto 0;background:rgba(196,146,42,.14);border:1px solid rgba(196,146,42,.5);border-radius:18px;padding:22px 28px;display:inline-block;min-width:280px}
.wcard .w-seat .s-l{font-size:14px;letter-spacing:.2em;color:var(--gold-lt);margin-bottom:8px}
.wcard .w-seat .s-v{font-family:var(--serif);font-size:46px;font-weight:900;color:var(--cream);line-height:1}
.wcard .w-info{margin-top:24px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wcard .w-info span{background:rgba(255,255,255,.06);border:1px solid rgba(196,146,42,.25);border-radius:99px;padding:9px 18px;font-size:15px;color:var(--cream)}
.wcard .w-note{margin-top:22px;font-size:16px;color:#d9e6d0;line-height:1.7}
.wcard .w-bless{margin-top:28px;border-top:1px solid rgba(196,146,42,.28);padding-top:22px}
.wcard .wb-label{font-family:var(--serif);font-size:19px;color:var(--gold-lt);font-weight:700;margin-bottom:16px}
.wcard .wb-chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wcard .wb-chip{background:rgba(255,255,255,.06);border:1px solid rgba(196,146,42,.35);color:var(--cream);border-radius:99px;padding:12px 22px;font-size:17px;font-family:inherit;cursor:pointer}
.wcard .wb-chip.on{background:var(--gold);color:#1a1a12;border-color:var(--gold);font-weight:700}
.wcard .wb-actions{display:flex;gap:12px;justify-content:center;margin-top:20px}
.wcard .wb-sign{background:transparent;border:1px solid var(--gold-lt);color:var(--gold-lt);border-radius:12px;padding:14px 26px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.wcard .wb-sign.signed{background:rgba(102,187,106,.16);border-color:rgba(102,187,106,.5);color:#9be0a3}
.wcard .wb-send{background:var(--gold);border:none;color:#1a1a12;border-radius:12px;padding:14px 34px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer}
.wcard .wb-done{margin-top:16px;font-size:16px;min-height:20px;font-weight:700}
/* 簽名板 */
.signcard{background:#15281c;border:1px solid var(--gold);border-radius:22px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sign-h{font-family:var(--serif);font-size:22px;color:var(--gold-lt);font-weight:700;margin-bottom:16px}
#sign-canvas{background:#fff;border-radius:14px;touch-action:none;display:block;max-width:90vw}
.sign-btns{display:flex;gap:12px;justify-content:center;margin-top:18px}
.sign-btns button{border-radius:12px;padding:14px 26px;font-size:17px;font-family:inherit;font-weight:700;cursor:pointer}
.sign-clear{background:transparent;border:1px solid rgba(245,236,212,.3);color:var(--cream)}
.sign-cancel{background:transparent;border:1px solid rgba(238,136,136,.4);color:#e69a9a}
.sign-ok{background:var(--gold);border:none;color:#1a1a12;font-weight:900}
.loading{margin:auto;font-size:20px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <img class="logo" src="../assets/logo/tada-logo-gold.png" alt="TADA">
  <div>
    <div class="h-title">貴　賓　報　到</div>
    <div class="h-sub">2026 第六屆會員大會暨理監事選舉 · 9/4 臻愛婚宴會館</div>
  </div>
  <div class="prog"><div class="n"><b id="p-checked">0</b> / <span id="p-total">0</span></div><div class="l">已報到</div></div>
  <button class="add-btn" id="add-btn" onclick="openAddGuest()">＋ 貴賓</button>
  <button class="fs-btn" id="qr-btn" onclick="showWalkinQR()" title="掃碼自助報到">📱</button>
  <button class="fs-btn" onclick="openSettings()" title="設定">⚙</button>
  <button class="fs-btn" id="fs-btn" onclick="toggleFS()" title="全螢幕">⛶</button>
</header>

<div class="top">
  <div class="filter-row"><span class="fr-label">類別</span><div class="units cats" id="cats"></div></div>
  <div class="filter-row"><span class="fr-label">單位</span><div class="units" id="units"></div></div>
</div>

<div class="bottom">
  <div class="guest-grid" id="list"><div class="loading">載入貴賓名冊…</div></div>
</div>

<!-- 現場新增貴賓（不在名單者簽到）-->
<div class="overlay" id="addModal" onclick="closeAddGuest()"><div class="addcard" onclick="event.stopPropagation()">
  <div class="add-h">新增貴賓報到</div>
  <div class="add-sub">名單中沒有您嗎？請填寫資料完成現場報到。</div>
  <label class="add-lb">姓名（必填）</label>
  <input id="ag-name" class="add-in" placeholder="您的姓名／稱謂">
  <label class="add-lb">服務單位</label>
  <input id="ag-org" class="add-in" placeholder="公司／機關名稱">
  <label class="add-lb">類別</label>
  <div class="add-cats" id="ag-cats"></div>
  <div class="add-btns">
    <button class="add-cancel" onclick="closeAddGuest()">取消</button>
    <button class="add-ok" onclick="submitAddGuest()">✓ 完成報到</button>
  </div>
  <div class="add-err" id="ag-err"></div>
</div></div>

<!-- 臨時貴賓掃碼報到 QR -->
<div class="overlay" id="qrModal" onclick="closeQR()"><div class="qrcard" onclick="event.stopPropagation()">
  <div class="qr-h">掃碼自助報到</div>
  <div class="qr-sub">貴賓可用手機掃描下方 QR Code，<br>填寫姓名、公司、車號即可完成報到。</div>
  <div id="qrbox"></div>
  <button class="qr-close" onclick="closeQR()">關閉</button>
</div></div>

<!-- 設定（前台顯示控制）-->
<div class="overlay" id="setModal" onclick="closeSettings()"><div class="addcard" onclick="event.stopPropagation()" style="max-width:440px">
  <div class="add-h">前台顯示設定</div>
  <div class="add-sub">控制這台裝置上「貴賓報到頁」要顯示哪些按鈕。給貴賓自助時可關閉工作人員按鈕。</div>
  <label class="set-row"><span>顯示「貴賓報到」按鈕<small>關閉＝純展示，貴賓無法自己點報到</small></span><input type="checkbox" id="set-checkin"></label>
  <label class="set-row"><span>顯示「＋ 貴賓」按鈕<small>工作人員現場新增用</small></span><input type="checkbox" id="set-add"></label>
  <label class="set-row"><span>顯示「📱 掃碼報到 QR」按鈕<small>貴賓手機掃碼自助報到</small></span><input type="checkbox" id="set-qr"></label>
  <div class="add-btns"><button class="add-ok" onclick="saveSettings()">✓ 套用</button></div>
</div></div>

<div class="overlay" id="welcome"><div class="wcard" id="wcard"></div></div>

<!-- 簽名板 -->
<div class="overlay" id="signModal"><div class="signcard">
  <div class="sign-h">請於下方簽名</div>
  <canvas id="sign-canvas" width="720" height="300"></canvas>
  <div class="sign-btns">
    <button class="sign-clear" onclick="clearSign()">清除重簽</button>
    <button class="sign-cancel" onclick="cancelSign()">取消</button>
    <button class="sign-ok" onclick="saveSign()">✓ 確定</button>
  </div>
</div></div>

<script>
const SB=window.TADA_SB_URL, H=()=>window.tadaSbHeaders();
const CATS=['公協會','學校單位','政府單位','農業合作單位'];
let guests=[], curCat='__all__', curOrg='__all__', searchQ='', wTimer=null;
function catFor(g){ return clean(g.category)||'農業合作單位'; }

async function rpc(fn,body){ const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H(),body:JSON.stringify(body)}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function clean(v){ v=(v==null?'':String(v)).trim(); return (v===''||v==='?'||v==='？')?'':v; }

async function load(){
  try{
    const r=await fetch(`${SB}/rest/v1/tada_guests?select=id,name,org,unit,category,seat,meal,train,note,checked_in&order=sort.asc,name.asc`,{headers:H()});
    guests=r.ok?await r.json():[];
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">載入失敗，請確認網路後重新整理。</div>'; return; }
  renderCats(); renderUnits(); renderList(); renderProg();
}
function renderCats(){
  const cnt={}; CATS.forEach(c=>cnt[c]={t:0,c:0});
  guests.forEach(g=>{ const c=catFor(g); if(!cnt[c])cnt[c]={t:0,c:0}; cnt[c].t++; if(g.checked_in)cnt[c].c++; });
  const allC=guests.filter(g=>g.checked_in).length;
  let html=`<div class="unit cat ${curCat==='__all__'?'on':''}" onclick="pickCat('__all__')"><div class="u-name">全部</div><div class="u-cnt"><b>${allC}</b> / ${guests.length}</div></div>`;
  html+=CATS.map(c=>`<div class="unit cat ${curCat===c?'on':''}" onclick="pickCat('${c}')"><div class="u-name">${esc(c)}</div><div class="u-cnt"><b>${cnt[c].c}</b> / ${cnt[c].t}</div></div>`).join('');
  document.getElementById('cats').innerHTML=html;
}
function pickCat(c){ curCat=c; curOrg='__all__'; searchQ=''; renderCats(); renderUnits(); renderList(); }
function renderProg(){
  document.getElementById('p-total').textContent=guests.length;
  document.getElementById('p-checked').textContent=guests.filter(g=>g.checked_in).length;
}
function orgKey(g){ return clean(g.unit)||clean(g.org)||'其他'; }
function renderUnits(){
  const pool=curCat==='__all__'?guests:guests.filter(g=>catFor(g)===curCat);
  const map=new Map();
  pool.forEach(g=>{ const k=orgKey(g); if(!map.has(k)) map.set(k,{t:0,c:0}); const m=map.get(k); m.t++; if(g.checked_in) m.c++; });
  const orgs=[...map.entries()].sort((a,b)=>b[1].t-a[1].t||a[0].localeCompare(b[0],'zh-Hant'));
  const allC=pool.filter(g=>g.checked_in).length;
  let html=`<div class="unit ${curOrg==='__all__'?'on':''}" onclick="pickOrg('__all__')"><div class="u-name">全部</div><div class="u-cnt"><b>${allC}</b> / ${pool.length}</div></div>`;
  html+=orgs.map(([k,m])=>`<div class="unit ${curOrg===k?'on':''}" onclick="pickOrg('${esc(k).replace(/'/g,"\\'")}')"><div class="u-name">${esc(k)}</div><div class="u-cnt"><b>${m.c}</b> / ${m.t}</div></div>`).join('');
  document.getElementById('units').innerHTML=html;
}
function pickOrg(k){ curOrg=k; searchQ=''; renderUnits(); renderList(); }
function renderList(){
  let arr=guests.slice();
  if(searchQ){ arr=arr.filter(g=>(g.name||'').includes(searchQ)); }
  else { if(curCat!=='__all__') arr=arr.filter(g=>catFor(g)===curCat); if(curOrg!=='__all__') arr=arr.filter(g=>orgKey(g)===curOrg); }
  const el=document.getElementById('list');
  if(!arr.length){ el.innerHTML='<div class="empty">此分類目前沒有貴賓，請改選其他單位或搜尋姓名。</div>'; return; }
  el.innerHTML=arr.map(g=>g.checked_in
    ? `<div class="gcard done">${GS.checkin?`<button class="g-reset" onclick="event.stopPropagation();doUncheck('${g.id}','${esc(g.name).replace(/'/g,"\\'")}')" title="按錯了？恢復未報到">↺ reset</button>`:''}<div><div class="g-name">${esc(g.name)}</div><div class="g-org">${esc(clean(g.org))}</div></div><div class="g-done">✓ 已完成報到</div></div>`
    : (GS.checkin
        ? `<div class="gcard" onclick="doCheckin('${g.id}')"><div><div class="g-name">${esc(g.name)}</div><div class="g-org">${esc(clean(g.org))}</div></div><button class="g-btn" onclick="event.stopPropagation();doCheckin('${g.id}')">貴賓報到</button></div>`
        : `<div class="gcard viewonly"><div><div class="g-name">${esc(g.name)}</div><div class="g-org">${esc(clean(g.org))}</div></div><div class="g-wait">未報到</div></div>`)
  ).join('');
}
async function doCheckin(id){
  const g=guests.find(x=>x.id===id); if(!g||g.checked_in) return;
  try{
    const res=await rpc('guest_checkin',{p_guest_id:id});
    if(res.ok || res.error==='already_checked_in'){ g.checked_in=true; renderCats(); renderUnits(); renderList(); renderProg(); showWelcome(res, id); }
    else alert('報到失敗：'+(res.error||'未知'));
  }catch(e){ alert('報到失敗：'+e.message); }
}
let agCat='農業合作單位';
function openAddGuest(){
  document.getElementById('ag-name').value='';
  document.getElementById('ag-org').value='';
  document.getElementById('ag-err').textContent='';
  agCat = curCat==='__all__' ? '公協會' : curCat;
  document.getElementById('ag-cats').innerHTML=CATS.map(c=>`<button class="ag-cat ${c===agCat?'on':''}" onclick="pickAgCat('${c}')">${c}</button>`).join('');
  document.getElementById('addModal').classList.add('show');
  setTimeout(()=>document.getElementById('ag-name').focus(),100);
}
function pickAgCat(c){ agCat=c; document.getElementById('ag-cats').innerHTML=CATS.map(x=>`<button class="ag-cat ${x===agCat?'on':''}" onclick="pickAgCat('${x}')">${x}</button>`).join(''); }
function closeAddGuest(){ document.getElementById('addModal').classList.remove('show'); }
async function submitAddGuest(){
  const name=document.getElementById('ag-name').value.trim();
  const org=document.getElementById('ag-org').value.trim();
  const err=document.getElementById('ag-err');
  if(!name){ err.textContent='請填寫姓名'; return; }
  err.textContent='';
  try{
    const res=await rpc('guest_add',{p_name:name,p_org:org,p_category:agCat});
    if(res.ok){
      guests.push({id:res.id,name:res.name,org:res.org,unit:res.org,category:res.category,seat:res.seat,checked_in:true});
      closeAddGuest(); renderCats(); renderUnits(); renderList(); renderProg(); showWelcome(res, res.id);
    } else err.textContent='新增失敗：'+(res.error||'未知');
  }catch(e){ err.textContent='新增失敗：'+e.message; }
}
async function doUncheck(id,name){
  if(!confirm(`將「${name}」恢復為「未報到」？`)) return;
  const g=guests.find(x=>x.id===id); if(!g) return;
  try{
    const res=await rpc('guest_checkin_undo',{p_guest_id:id});
    if(res.ok){ g.checked_in=false; renderCats(); renderUnits(); renderList(); renderProg(); }
    else alert('恢復失敗：'+(res.error||'未知'));
  }catch(e){ alert('恢復失敗：'+e.message); }
}
const BLESS=['祝大會圓滿順利','祝會務蒸蒸日上','祝 TADA 智耕傳承 · 鵬程萬里'];
let wGuestId=null, wBless='', wSig='';
function showWelcome(d, gid){
  wGuestId=gid||d.id||null; wBless=''; wSig='';
  const chips=[];
  if(clean(d.meal)) chips.push('🍽️ '+esc(clean(d.meal)));
  if(clean(d.train)) chips.push('🚄 '+esc(clean(d.train)));
  const seat=clean(d.seat);
  document.getElementById('wcard').innerHTML=
    `<button class="w-x" onclick="closeWelcome()">✕</button>
     <div class="w-hi">歡　迎　蒞　臨</div>
     <div class="w-name">${esc(d.name)}</div>
     ${clean(d.org)?`<div class="w-org">${esc(clean(d.org))}</div>`:''}
     ${seat?`<div class="w-seat"><div class="s-l">您的桌號</div><div class="s-v">${esc(seat)}</div></div>`
           :`<div class="w-seat"><div class="s-l">桌號</div><div class="s-v" style="font-size:24px;">請洽接待人員</div></div>`}
     ${chips.length?`<div class="w-info">${chips.map(c=>'<span>'+c+'</span>').join('')}</div>`:''}
     ${clean(d.note)?`<div class="w-note">📌 ${esc(clean(d.note))}</div>`:''}
     <div class="w-bless">
       <div class="wb-label">🙏 感謝您的蒞臨，為大會獻上祝福</div>
       <div class="wb-chips" id="wb-chips"></div>
       <div class="wb-actions">
         <button class="wb-sign" id="wb-sign" onclick="openSign()">✍️ 簽名</button>
         <button class="wb-send" onclick="submitGreeting()">送出祝福</button>
       </div>
       <div class="wb-done" id="wb-done"></div>
     </div>`;
  renderBlessChips();
  document.getElementById('welcome').classList.add('show');
}
function renderBlessChips(){
  document.getElementById('wb-chips').innerHTML=BLESS.map(b=>`<button class="wb-chip ${b===wBless?'on':''}" onclick="pickBless('${b.replace(/'/g,"\\'")}')">${esc(b)}</button>`).join('');
}
function pickBless(b){ wBless=(wBless===b?'':b); renderBlessChips(); }
async function submitGreeting(){
  const done=document.getElementById('wb-done');
  if(!wGuestId){ closeWelcome(); return; }
  if(!wBless && !wSig){ done.textContent='請選一句祝福或簽名，或按 ✕ 關閉'; done.style.color='#e0b458'; return; }
  try{
    await rpc('guest_greeting',{p_guest_id:wGuestId,p_greeting:wBless||null,p_signature:wSig||null});
    done.textContent='🎉 已收到您的祝福，感謝！'; done.style.color='#9be0a3';
    setTimeout(closeWelcome,1400);
  }catch(e){ done.textContent='送出失敗，請重試'; done.style.color='#f0a'; }
}
function closeWelcome(){ document.getElementById('welcome').classList.remove('show'); }
let qrDone=false;
function showWalkinQR(){
  const box=document.getElementById('qrbox');
  if(!qrDone && window.QRCode){ new QRCode(box,{text:'https://tada-ai.org.tw/guest/walkin/',width:300,height:300,correctLevel:QRCode.CorrectLevel.M}); qrDone=true; }
  document.getElementById('qrModal').classList.add('show');
}
function closeQR(){ document.getElementById('qrModal').classList.remove('show'); }
// ── 前台顯示設定（記在該裝置）──────────────────────
let GS={checkin:true,add:true,qr:true};
try{ const s=JSON.parse(localStorage.getItem('tadaGuestUI')||'{}'); GS={...GS,...s}; }catch(e){}
function applySettings(){
  const ab=document.getElementById('add-btn'); if(ab) ab.style.display=GS.add?'':'none';
  const qb=document.getElementById('qr-btn'); if(qb) qb.style.display=GS.qr?'':'none';
  if(typeof renderList==='function') renderList();
}
function openSettings(){
  document.getElementById('set-checkin').checked=GS.checkin;
  document.getElementById('set-add').checked=GS.add;
  document.getElementById('set-qr').checked=GS.qr;
  document.getElementById('setModal').classList.add('show');
}
function closeSettings(){ document.getElementById('setModal').classList.remove('show'); }
function saveSettings(){
  GS={checkin:document.getElementById('set-checkin').checked,
      add:document.getElementById('set-add').checked,
      qr:document.getElementById('set-qr').checked};
  try{ localStorage.setItem('tadaGuestUI',JSON.stringify(GS)); }catch(e){}
  closeSettings(); applySettings();
}

/* 簽名板 */
let sigCtx=null, sigDrawing=false, sigHas=false;
function openSign(){
  document.getElementById('signModal').classList.add('show');
  const cv=document.getElementById('sign-canvas');
  sigCtx=cv.getContext('2d'); sigHas=false;
  sigCtx.clearRect(0,0,cv.width,cv.height);
  sigCtx.lineWidth=3.5; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#20261f';
  sigCtx.fillStyle='#fff'; sigCtx.fillRect(0,0,cv.width,cv.height);
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [(t.clientX-r.left)*cv.width/r.width,(t.clientY-r.top)*cv.height/r.height]; };
  const start=e=>{ e.preventDefault(); sigDrawing=true; sigHas=true; const [x,y]=pos(e); sigCtx.beginPath(); sigCtx.moveTo(x,y); };
  const move=e=>{ if(!sigDrawing)return; e.preventDefault(); const [x,y]=pos(e); sigCtx.lineTo(x,y); sigCtx.stroke(); };
  const end=()=>{ sigDrawing=false; };
  cv.onpointerdown=start; cv.onpointermove=move; cv.onpointerup=end; cv.onpointerleave=end;
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearSign(){ const cv=document.getElementById('sign-canvas'); sigCtx.fillStyle='#fff'; sigCtx.fillRect(0,0,cv.width,cv.height); sigHas=false; }
function cancelSign(){ document.getElementById('signModal').classList.remove('show'); }
function saveSign(){
  if(!sigHas){ cancelSign(); return; }
  wSig=document.getElementById('sign-canvas').toDataURL('image/png');
  document.getElementById('signModal').classList.remove('show');
  const b=document.getElementById('wb-sign'); if(b){ b.textContent='✓ 已簽名'; b.classList.add('signed'); }
}
function toggleFS(){
  const d=document.documentElement;
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
    }
  }catch(e){}
  if(!(d.requestFullscreen||d.webkitRequestFullscreen)){
    alert('此裝置不支援網頁全螢幕。\niPad 建議用 Safari 分享 →「加入主畫面」，再從主畫面圖示開啟即為全螢幕。');
  }
}

applySettings();
load();
// 每 20 秒同步一次（多台裝置或後台改動時）
setInterval(()=>{ if(!document.getElementById('welcome').classList.contains('show')) load(); }, 20000);
</script>
