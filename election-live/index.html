<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時開票｜TADA 理監事選舉</title>
<script src="../assets/liff-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#b8913a;--gold-light:#d4a853;--green-deep:#14231a;--green-mid:#2d5235;--green-light:#7fae86;--cream:#f8f4ea;--line:#3a5540;}
html,body{height:100%;}
body{font-family:'Noto Sans TC',sans-serif;background:radial-gradient(ellipse at top,#1e3320,#0d1710);color:var(--cream);min-height:100vh;overflow-x:hidden;}
.bar{height:6px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.wrap{max-width:1500px;margin:0 auto;padding:26px 34px;}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.head .kick{font-size:14px;letter-spacing:0.35em;color:var(--gold-light);font-weight:600;}
.head .title{font-family:'Noto Serif TC',serif;font-size:34px;font-weight:900;color:#fff;line-height:1.2;}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:5px 16px;border-radius:20px;letter-spacing:.1em;}
.pill.open{background:rgba(184,145,58,.2);color:var(--gold-light);border:1px solid var(--gold);}
.pill.closed{background:rgba(127,174,134,.18);color:var(--green-light);border:1px solid var(--green-light);}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:16px 26px;text-align:center;flex:1;min-width:150px;}
.stat .n{font-family:'Noto Serif TC',serif;font-size:42px;font-weight:900;color:var(--gold-light);line-height:1;}
.stat .l{font-size:13px;color:var(--green-light);margin-top:8px;letter-spacing:.08em;}
.prog{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:14px 0 22px;}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .6s;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:1000px){.grid{grid-template-columns:1fr;}}
.panel{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:20px 22px 8px;}
.panel h2{font-family:'Noto Serif TC',serif;font-size:22px;color:#fff;margin-bottom:2px;}
.panel .seat{font-size:13px;color:var(--green-light);margin-bottom:6px;}
.chart{width:100%;height:520px;}
.foot{text-align:center;color:var(--green-light);font-size:12px;margin-top:20px;letter-spacing:.1em;}
.loading{text-align:center;padding:120px 20px;color:var(--green-light);font-size:18px;}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <div id="loading" class="loading">連線開票系統…</div>

  <div id="board" style="display:none;">
    <div class="head">
      <div>
        <div class="kick">TADA 理監事選舉 · 即時開票</div>
        <div class="title" id="e-title">理監事改選</div>
      </div>
      <div><span class="pill" id="status-pill"></span></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="st-checked">0</div><div class="l">已報到領票</div></div>
      <div class="stat"><div class="n" id="st-cast">0</div><div class="l">已投票</div></div>
      <div class="stat"><div class="n" id="st-rate">0%</div><div class="l">投票率</div></div>
      <div class="stat"><div class="n" id="st-total">0</div><div class="l">應到會員</div></div>
    </div>
    <div class="prog"><i id="prog-bar" style="width:0%"></i></div>

    <div class="grid">
      <div class="panel">
        <h2>理事</h2>
        <div class="seat" id="d-seat"></div>
        <div class="chart" id="chart-d"></div>
      </div>
      <div class="panel">
        <h2>監事</h2>
        <div class="seat" id="s-seat"></div>
        <div class="chart" id="chart-s"></div>
      </div>
    </div>
    <div class="foot" id="foot">每 3 秒自動更新　·　🟡 當選　🟢 候補　·　🟠 同票待抽籤（依人民團體選舉慣例，不以號次決定）</div>
  </div>
</div>

<script>
let election = null, chartD = null, chartS = null;
const GOLD='#d4a853', GREEN='#7fae86', GREY='#4a6b52', TIE='#d97b45';

async function rpc(fn, body){
  const res = await fetch(`${window.TADA_SB_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers: window.tadaSbHeaders(), body: JSON.stringify(body) });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

async function boot(){
  if(!(await window.tadaFeatureOn('live'))){
    window.tadaGateNotice({title:'開票直播尚未開始', msg:'即時開票將於現場投票結束後開放，敬請期待。'});
    return;
  }
  const r = await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_election?status=in.(open,closed)&order=created_at.desc&limit=1`, { headers: window.tadaSbHeaders() });
  const list = r.ok ? await r.json() : [];
  if(!list.length){ document.getElementById('loading').textContent='目前沒有進行中或已結束的選舉場次。'; return; }
  election = list[0];
  document.getElementById('loading').style.display='none';
  document.getElementById('board').style.display='block';
  document.getElementById('e-title').textContent = election.title;
  document.getElementById('d-seat').textContent = `應選 ${election.director_seats} 席・候補 ${election.director_reserve} 席`;
  document.getElementById('s-seat').textContent = `應選 ${election.supervisor_seats} 席・候補 ${election.supervisor_reserve} 席`;
  chartD = echarts.init(document.getElementById('chart-d'));
  chartS = echarts.init(document.getElementById('chart-s'));
  window.addEventListener('resize', ()=>{ chartD.resize(); chartS.resize(); });
  await tick();
  setInterval(tick, 3000);
}

async function tick(){
  try{
    // 當選／候補的權威判定在 vote_outcome（0 票不當選、同票不以號次決勝）；
    // 舊的 vote_results 只有票數，僅在 outcome 取不到時退回使用。
    const [prog, results] = await Promise.all([
      rpc('vote_progress', { p_election: election.id }),
      rpc('vote_outcome',  { p_election: election.id }).catch(()=>null)
        .then(r => (r && r.candidates) ? r : rpc('vote_results', { p_election: election.id })),
    ]);
    renderStats(prog);
    const cands = results.candidates || [];
    renderChart(chartD, cands.filter(c=>c.position==='director'),   election.director_seats,   election.director_reserve);
    renderChart(chartS, cands.filter(c=>c.position==='supervisor'), election.supervisor_seats, election.supervisor_reserve);
  }catch(e){}
}

function renderStats(p){
  const pill = document.getElementById('status-pill');
  const isOpen = election.status==='open';
  pill.className = 'pill '+(isOpen?'open':'closed');
  pill.textContent = isOpen ? '● 投票進行中' : '● 投票已結束';
  document.getElementById('st-checked').textContent = p.checked_in;
  document.getElementById('st-cast').textContent = p.ballots_cast;
  document.getElementById('st-total').textContent = p.total_members;
  const rate = p.checked_in ? Math.round(p.ballots_cast/p.checked_in*100) : 0;
  document.getElementById('st-rate').textContent = rate+'%';
  document.getElementById('prog-bar').style.width = rate+'%';
}

const OUTCOME_COLOR={ elected:GOLD, reserve:GREEN, tiebreak:TIE, not_elected:GREY };
// 公司名縮短：去掉常見組織字尾，過長再截斷（手機標籤空間有限）
function shortCompany(name){
  if(!name) return '';
  let t = name.replace(/(股份有限公司|有限公司|企業股份|企業社|合作社|股份|公司)$/,'')
              .replace(/^(保證責任|財團法人|社團法人)/,'');
  if(t.length > 9) t = t.slice(0,8) + '…';
  return t;
}
function renderChart(chart, arr, seats, reserve){
  // 依得票排序（高→低）。同票時僅為畫面排列，不代表名次先後——
  // 誰當選由 status 決定，跨越分界的同票組會標成 tiebreak 待抽籤。
  arr = arr.slice().sort((a,b)=> b.votes - a.votes || (a.no||0)-(b.no||0));
  const narrow = window.innerWidth < 600;
  const names = arr.map(c=> c.name + (c.status==='tiebreak' ? '⚠' : ''));
  const data = arr.map((c,i)=>{
    let color;
    if(c.status) color = OUTCOME_COLOR[c.status] || GREY;
    else {                                   // 退回舊邏輯（vote_outcome 取不到時）
      color = GREY;
      if(i < seats) color = GOLD;
      else if(i < seats + reserve) color = GREEN;
    }
    return { value: c.votes, itemStyle:{ color, borderRadius:[0,6,6,0] } };
  });
  // 列數多時拉高圖表，讓兩行標籤不擠
  const el = chart.getDom();
  const wantH = Math.max(300, arr.length * (narrow ? 44 : 36) + 20);
  if(el.clientHeight !== wantH){ el.style.height = wantH + 'px'; chart.resize(); }
  // 橫向長條，最高票在最上方 → yAxis 反轉
  chart.setOption({
    grid:{ left:8, right:narrow?44:70, top:6, bottom:6, containLabel:true },
    xAxis:{ type:'value', minInterval:1,
            axisLabel:{color:'#7fae86'}, splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}} },
    yAxis:{ type:'category', inverse:true, data:names,
      axisLabel:{
        color:'#f8f4ea', fontSize:narrow?13:15, fontWeight:700,
        formatter:(val, idx)=>{
          const c = arr[idx] || {};
          const comp = shortCompany(c.company);
          const tie = c.status==='tiebreak' ? '⚠' : '';
          return comp ? `{n|${c.name}${tie}}\n{co|${comp}}` : `{n|${c.name}${tie}}`;
        },
        rich:{
          n:{ color:'#f8f4ea', fontSize:narrow?13:15, fontWeight:700, align:'right', lineHeight:narrow?17:20 },
          co:{ color:'#9db8a1', fontSize:narrow?10:12, align:'right', lineHeight:narrow?13:16 }
        }
      },
      axisLine:{show:false}, axisTick:{show:false} },
    series:[{ type:'bar', data, barMaxWidth:26,
      label:{ show:true, position:'right', color:'#d4a853', fontWeight:900, fontSize:narrow?14:16, formatter:'{c}' },
      animationDuration:500 }]
  });
}

boot();
</script>
</body>
</html>
