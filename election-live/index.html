<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時開票｜TADA 第六屆理監事改選</title>
<script src="../assets/liff-common.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#b8913a;--gold-light:#d4a853;--gold-pale:#f5ecd4;--green-deep:#14241a;--green-mid:#2d5235;--green-light:#5a8a60;--elect:#66bb6a;--reserve:#e0b23a;}
body{font-family:'Noto Sans TC',sans-serif;background:radial-gradient(circle at 50% 20%,#24402a,#122016);color:#fff;min-height:100vh;padding:34px 40px;}
.head{text-align:center;margin-bottom:26px;}
.kick{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;}
.title{font-family:'Noto Serif TC',serif;font-size:40px;font-weight:900;color:#fff;margin-top:8px;}
.title .live{color:var(--gold-light);}
.progress-wrap{max-width:900px;margin:0 auto 30px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:16px;}
.stat{background:rgba(255,255,255,0.05);border:1px solid rgba(184,145,58,0.25);border-radius:14px;padding:18px 20px;text-align:center;}
.stat .l{font-size:15px;color:var(--green-light);letter-spacing:0.1em;}
.stat .n{font-family:'Noto Serif TC',serif;font-size:52px;font-weight:900;line-height:1.1;margin-top:4px;}
.stat .n.g{color:var(--gold-light);}
.bar{height:14px;background:rgba(255,255,255,0.08);border-radius:7px;overflow:hidden;}
.bar > div{height:100%;background:linear-gradient(90deg,var(--green-mid),var(--gold));transition:width .6s;}
.status-pill{text-align:center;margin:8px 0 0;font-size:16px;color:var(--gold-pale);letter-spacing:0.15em;}
.results{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.col h2{font-family:'Noto Serif TC',serif;font-size:24px;color:var(--gold-light);text-align:center;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(184,145,58,0.3);}
.cand{margin-bottom:12px;}
.cand-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.cand-name{font-size:19px;font-weight:700;}
.cand-name .badge{font-size:13px;padding:2px 12px;border-radius:14px;margin-left:8px;font-weight:500;}
.badge.elect{background:rgba(102,187,106,0.2);color:var(--elect);border:1px solid rgba(102,187,106,0.5);}
.badge.reserve{background:rgba(224,178,58,0.15);color:var(--reserve);border:1px solid rgba(224,178,58,0.5);}
.cand-votes{font-family:'DM Mono',monospace;font-size:18px;color:var(--gold-light);}
.cbar{height:16px;background:rgba(255,255,255,0.07);border-radius:8px;overflow:hidden;}
.cbar > div{height:100%;transition:width .6s;}
.cbar.e > div{background:linear-gradient(90deg,var(--green-mid),var(--elect));}
.cbar.r > div{background:linear-gradient(90deg,#7a611a,var(--reserve));}
.waiting{text-align:center;padding:70px 20px;color:var(--green-light);font-size:22px;}
.foot{text-align:center;margin-top:26px;font-size:13px;color:var(--green-light);letter-spacing:0.1em;}
@media (max-width:820px){.results{grid-template-columns:1fr;}.title{font-size:28px;}.stat .n{font-size:38px;}}
</style>
</head>
<body>
<div class="head">
  <div class="kick">Live Result</div>
  <div class="title" id="title">第六屆理監事改選 <span class="live">即時開票</span></div>
</div>

<div class="progress-wrap">
  <div class="stats">
    <div class="stat"><div class="l">有效會員</div><div class="n" id="s-total">–</div></div>
    <div class="stat"><div class="l">已投票</div><div class="n g" id="s-voted">–</div></div>
    <div class="stat"><div class="l">投票率</div><div class="n" id="s-rate">–</div></div>
  </div>
  <div class="bar"><div id="p-bar" style="width:0%"></div></div>
  <div class="status-pill" id="status-pill">載入中…</div>
</div>

<div id="results" class="results" style="display:none;">
  <div class="col"><h2 id="d-head">理事（應選 11・候補 3）</h2><div id="d-list"></div></div>
  <div class="col"><h2 id="s-head">監事（應選 3・候補 1）</h2><div id="s-list"></div></div>
</div>
<div id="waiting" class="waiting" style="display:none;"></div>

<div class="foot">台灣科技農企業發展協會 · 第六屆會員大會</div>

<script>
const SB = window.TADA_SB_URL, H = window.tadaSbHeaders();
let election = null;

async function rpc(fn, body){
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method:'POST', headers:H, body:JSON.stringify(body) });
  return r.ok ? r.json() : [];
}

async function loadElection(){
  const r = await fetch(`${SB}/rest/v1/tada_elections?status=in.(open,closed)&order=created_at.desc&limit=1`, { headers:H });
  const list = r.ok ? await r.json() : [];
  return list[0] || null;
}

function renderCol(arr, seats, reserve, elId){
  const max = Math.max(1, ...arr.map(c=>Number(c.votes)));
  document.getElementById(elId).innerHTML = arr.map((c,i)=>{
    const cls = i < seats ? 'e' : (i < seats+reserve ? 'r' : '');
    const badge = i < seats ? '<span class="badge elect">當選</span>' : (i < seats+reserve ? '<span class="badge reserve">候補</span>' : '');
    const w = Math.round(Number(c.votes)/max*100);
    return `<div class="cand"><div class="cand-top"><span class="cand-name">${esc(c.name)}${badge}</span><span class="cand-votes">${c.votes}</span></div><div class="cbar ${cls}"><div style="width:${w}%"></div></div></div>`;
  }).join('');
}

async function tick(){
  try{
    if(!election){ election = await loadElection(); }
    if(!election){ document.getElementById('status-pill').textContent='目前沒有進行中的選舉'; return; }
    document.getElementById('title').firstChild.textContent = election.title + ' ';
    document.getElementById('d-head').textContent = `理事（應選 ${election.director_seats}・候補 ${election.director_reserve}）`;
    document.getElementById('s-head').textContent = `監事（應選 ${election.supervisor_seats}・候補 ${election.supervisor_reserve}）`;

    const prog = (await rpc('election_progress',{p_election:election.id}))[0] || {total:0,voted:0};
    const total = Number(prog.total), voted = Number(prog.voted);
    const rate = total ? Math.round(voted/total*100) : 0;
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-voted').textContent = voted;
    document.getElementById('s-rate').textContent = rate + '%';
    document.getElementById('p-bar').style.width = rate + '%';

    // 重新讀狀態（可能已從 open→closed）
    const er = await fetch(`${SB}/rest/v1/tada_elections?id=eq.${election.id}&select=status`, { headers:H });
    const st = er.ok ? (await er.json())[0]?.status : election.status;
    election.status = st;

    if(st === 'closed'){
      document.getElementById('status-pill').textContent = '✓ 投票已截止 · 開票結果';
      const res = await rpc('election_results',{p_election:election.id});
      renderCol(res.filter(c=>c.category==='director'), election.director_seats, election.director_reserve, 'd-list');
      renderCol(res.filter(c=>c.category==='supervisor'), election.supervisor_seats, election.supervisor_reserve, 's-list');
      document.getElementById('results').style.display='grid';
      document.getElementById('waiting').style.display='none';
    } else {
      document.getElementById('status-pill').textContent = '● 投票進行中 · 開票結果將於截止後公布';
      document.getElementById('results').style.display='none';
      document.getElementById('waiting').style.display='none';
    }
  }catch(e){ document.getElementById('status-pill').textContent='更新失敗，重試中…'; }
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
tick(); setInterval(tick, 4000);
</script>
</body>
</html>
