<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 報到機必備：Chromium 的 --disable-features=Translate 旗標擋不住翻譯列，只有這個 meta 有效 -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>TADA 報到機｜會員報到領票</title>
<!--
  ── 樹莓派報到 Kiosk 設定 ────────────────────────────────────────────────
  硬體：觸控螢幕（1200×800）＋ USB QR Code Reader（HID 鍵盤型，掃描後自動輸入內容＋Enter）＋ 網路印表機
  啟動（全螢幕、免列印對話框自動出票）：
    chromium-browser --kiosk --kiosk-printing --disable-pinch \
      --overscroll-history-navigation=0 --app=https://tada-ai.org.tw/kiosk/
  印表機：於樹莓派 CUPS 安裝網路印表機並設為「預設」，--kiosk-printing 會靜默列印到預設印表機。
    （熱感應出票機建議紙寬 80mm；本頁列印版面已依 80mm 設計）
  會員 QR：內容為「會員編號」或含編號的網址皆可（系統自動擷取數字）。
-->
<script src="../assets/liff-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a14;--gold:#b8913a;--gold-light:#d4a853;--green-deep:#14231a;--green-mid:#2d5235;--green-light:#7fae86;--cream:#f8f4ea;--line:#e5ddc8;--red:#c0392b;}
html,body{width:1200px;height:800px;overflow:hidden;}
/*
  ── 小螢幕自動縮放 ──────────────────────────────────────────────────────
  版面是照 1200×800 設計的（含 80mm 列印版型），直接改成流動式風險太高。
  改成把整個 1200×800 的畫布等比縮到螢幕裡：版面比例、字級關係、列印
  版型全部不動，只是整體變小。
  800×480 的樹莓派 DSI 螢幕縮放後為 0.6，原本 78px 的姓名仍有 47px。
  只作用於螢幕，@media print 不受影響。
*/
@media screen{
  html{width:100%;height:100%;background:#0d1710;}
  /*
    螢幕用的畫布改成 1200×720（比例 1.667），與 800×480 的 DSI 螢幕完全相同，
    等比縮放後正好滿版、左右不留黑邊、也不裁切、不變形。
    原本 1200×800（比例 1.5）縮進 1.667 的螢幕，左右必然各留 40px。
    列印版型不受影響——@media print 另有一套。
  */
  /* 用 html 前綴提高權重：原本的 .screen{height:794px} 寫在後面會蓋掉同權重的規則 */
  html body{height:720px;transform-origin:top left;}
  html body .screen{height:720px;}
}
body{font-family:'Noto Sans TC',sans-serif;background:radial-gradient(ellipse at top,#1e3320,#0d1710);color:var(--cream);user-select:none;-webkit-user-select:none;cursor:default;}
/* 頂部金綠裝飾條取消：小螢幕上看起來像畫面沒滿版（使用者回饋 2026-09-03） */
.bar{display:none;}
.screen{height:800px;display:flex;flex-direction:column;}
/* 頂列 */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 40px;border-bottom:1px solid rgba(255,255,255,.08);}
.top .t-title{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:900;color:#fff;}
.top .t-kick{font-size:13px;letter-spacing:.3em;color:var(--gold-light);font-weight:600;margin-bottom:2px;}
.top .t-prog{text-align:right;font-size:14px;color:var(--green-light);}
.top .t-prog b{font-family:'Noto Serif TC',serif;font-size:26px;color:var(--gold-light);display:block;line-height:1;}
/* 主區 */
.main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;}
.view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 60px;}
.view.on{display:flex;}
/* 待機（兩步驟）*/
.idle-grid{display:flex;align-items:stretch;gap:0;width:100%;max-width:1000px;}
.idle-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 40px;}
.idle-div{width:1px;background:rgba(255,255,255,.12);margin:20px 0;}
.step{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.25em;color:var(--gold);font-weight:700;margin-bottom:8px;}
.idle-h{font-family:'Noto Serif TC',serif;font-size:34px;font-weight:900;color:#fff;margin-bottom:22px;}
.oa-qr{width:240px;height:240px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.oa-qr img,.oa-qr canvas{width:212px!important;height:212px!important;}
.oa-qr .ph{color:#999;font-size:14px;text-align:center;padding:10px;font-family:'Noto Sans TC';}
/* 掃描圖示：內嵌 SVG（樹莓派 Chromium 無彩色 emoji 字型，📷 會顯示不出來） */
#v-idle .scan-ic{width:150px;margin:6px auto;animation:pulse 1.8s ease-in-out infinite;}
#v-idle .scan-ic svg{display:block;width:100%;height:auto;}
#v-idle .scan-line{animation:scanline 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.08);opacity:1;}}
@keyframes scanline{0%,100%{transform:translateY(16px);opacity:.25;}50%{transform:translateY(78px);opacity:1;}}
.idle-p{font-size:19px;color:var(--green-light);line-height:1.8;margin-top:22px;}
.prog-box{margin-top:20px;padding:14px 34px;border:2px solid rgba(212,168,83,.35);border-radius:14px;text-align:center;}
.prog-box b{display:block;font-family:'Noto Serif TC',serif;font-size:46px;line-height:1;color:var(--gold-light);}
.prog-box span{font-size:17px;color:var(--green-light);}
.kbd-btn{margin-top:26px;padding:14px 30px;font-family:inherit;font-size:18px;font-weight:700;color:var(--gold-light);background:transparent;border:2px solid rgba(212,168,83,.5);border-radius:12px;cursor:pointer;}
.kbd-btn:active{background:rgba(212,168,83,.15);}
/* 找到會員 */
#v-found .welcome{font-size:22px;color:var(--gold-light);letter-spacing:.2em;margin-bottom:14px;}
#v-found .nm{font-family:'Noto Serif TC',serif;font-size:78px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:10px;}
#v-found .no{font-size:24px;color:var(--green-light);margin-bottom:8px;letter-spacing:.05em;}
#v-found .rep{font-size:19px;color:var(--green-light);}
.btn-row{display:flex;gap:26px;margin-top:52px;}
.big{padding:0 54px;height:118px;display:flex;align-items:center;justify-content:center;gap:14px;font-family:inherit;font-size:32px;font-weight:900;border:none;border-radius:16px;cursor:pointer;letter-spacing:.05em;}
.big.go{background:linear-gradient(180deg,#3f8a4f,#2d5235);color:#fff;box-shadow:0 10px 30px rgba(45,82,53,.5);}
.big.go:active{transform:translateY(2px);}
.big.cancel{background:rgba(255,255,255,.06);color:var(--cream);border:2px solid rgba(255,255,255,.2);}
.warn-box{margin-top:30px;background:rgba(192,57,43,.15);border:2px solid rgba(192,57,43,.5);color:#ff9b8f;font-size:24px;font-weight:700;padding:20px 40px;border-radius:14px;}
/* 列印中 */
#v-print .p-ic{font-size:130px;margin-bottom:20px;}
/* 無印表機模式的螢幕選票。白底是必要的——QR 在深色底上掃不到 */
#v-print .screen-ballot{display:none;background:#fff;padding:18px;border-radius:18px;margin-bottom:18px;}
#v-print .screen-ballot img,#v-print .screen-ballot canvas{width:230px!important;height:230px!important;display:block;}
#v-print h1{font-family:'Noto Serif TC',serif;font-size:46px;font-weight:900;color:#fff;margin-bottom:16px;}
#v-print p{font-size:24px;color:var(--gold-light);}
/* 提示（查無 / 錯誤） */
.toast{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:rgba(192,57,43,.92);color:#fff;font-size:22px;font-weight:700;padding:16px 36px;border-radius:12px;display:none;z-index:20;}
.toast.on{display:block;}
/* 數字鍵盤 */
/*
  鍵盤只佔右半邊：有人在輸入會員編號時，左邊的 LINE QR 仍然看得到、掃得到，
  兩個人可以同時使用。蓋滿全螢幕會讓排隊的人乾等。
  待機版面是 max-width:1000px 置中於 1200，左右欄的分界正好落在 50%。
*/
.t-status{padding:9px 20px;font-family:inherit;font-size:17px;font-weight:700;color:var(--green-light);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:10px;cursor:pointer;}
.t-status:active{background:rgba(255,255,255,.15);}
.statuspanel{position:fixed;inset:0;background:#060e09;display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:60;padding:16px 60px 14px;overflow-y:auto;}
.statuspanel.on{display:flex;}
.statuspanel h2{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:900;color:#fff;margin-bottom:12px;flex:0 0 auto;}
.statuspanel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;font-size:16.5px;width:100%;max-width:620px;}
.statuspanel dt{color:var(--green-light);white-space:nowrap;}
.statuspanel dd{color:#fff;font-weight:700;text-align:right;}
.statuspanel dd.ok{color:#7fd694;}
.statuspanel dd.bad{color:#ff8b7a;}
.st-foot{margin-top:10px;font-size:12.5px;color:var(--green-light);flex:0 0 auto;}

/* ── Wi-Fi 設定 ── */
.wf-list{width:100%;max-width:660px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.wf-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);
  border-radius:12px;padding:13px 20px;font-size:19px;color:#fff;font-family:inherit;cursor:pointer;text-align:left;}
.wf-row:active{background:rgba(255,255,255,.14);}
.wf-row .sig{font-family:monospace;color:var(--gold-light);letter-spacing:1px;flex:0 0 auto;}
.wf-row .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wf-row .tag{font-size:12px;color:#7fd694;border:1px solid rgba(127,214,148,.5);border-radius:99px;padding:2px 10px;flex:0 0 auto;}
.wf-row .cur{color:#7fd694;font-weight:900;flex:0 0 auto;}
.wf-pwhead{font-size:20px;color:#fff;margin-bottom:10px;}
.wf-pwhead b{color:var(--gold-light);}
.wf-pwbox{width:100%;max-width:660px;min-height:52px;background:#0d1710;border:2px solid var(--gold);border-radius:10px;
  padding:10px 16px;font-family:'DM Mono',monospace;font-size:24px;color:#fff;letter-spacing:2px;
  display:flex;align-items:center;word-break:break-all;}
.wf-kb{width:100%;max-width:760px;display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.wf-kb .kbrow{display:flex;gap:7px;justify-content:center;}
.wf-kb button{flex:1;max-width:66px;height:50px;font-size:20px;font-weight:700;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:9px;cursor:pointer;}
.wf-kb button:active{background:var(--gold);color:#1a1a12;}
.wf-kb button.wide{max-width:120px;font-size:16px;}
.wf-kb button.space{max-width:300px;}
.wf-kb button.on{background:var(--gold);color:#1a1a12;}
.wf-actions{display:flex;gap:12px;margin-top:14px;}
.wf-actions button{padding:12px 34px;font-size:18px;font-weight:700;font-family:inherit;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.25);}
.wf-actions button.go{background:var(--gold);color:#1a1a12;border:none;}
#wf-msg{min-height:26px;margin-top:10px;font-size:16px;color:var(--gold-light);}
.keypad{position:absolute;inset:0 0 0 50%;background:#060e09;border-left:1px solid rgba(212,168,83,.25);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:0 28px;}
.keypad.on{display:flex;}
/* 查詢方式分頁：會員編號／統一編號／手機號碼 */
.keypad .kp-tabs{display:flex;gap:8px;margin-bottom:12px;}
.keypad .kp-tabs button{flex:1;padding:14px 6px;font-family:inherit;font-size:21px;font-weight:700;color:var(--green-light);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14);border-radius:12px;cursor:pointer;white-space:nowrap;}
.keypad .kp-tabs button.on{color:#0d1710;background:var(--gold-light);border-color:var(--gold-light);}
.keypad .kp-hint{font-size:17px;color:var(--green-light);margin-bottom:10px;min-height:22px;text-align:center;}
.keypad .kp-display{width:100%;max-width:500px;height:74px;background:#fff;color:#111;font-size:40px;font-weight:900;letter-spacing:6px;text-align:center;line-height:74px;border-radius:12px;margin-bottom:16px;min-height:74px;}
.keypad .kp-grid{display:grid;grid-template-columns:repeat(3,158px);gap:14px;}
.keypad .kp-pick{display:none;flex-direction:column;gap:10px;width:100%;max-width:500px;max-height:250px;overflow-y:auto;}
.keypad .kp-pick button{padding:16px;font-family:inherit;font-size:26px;font-weight:900;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:12px;cursor:pointer;text-align:left;}
.keypad .kp-pick button small{display:block;font-size:15px;font-weight:400;color:var(--green-light);margin-top:4px;}
.keypad .kp-grid button{height:86px;font-family:inherit;font-size:38px;font-weight:900;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:12px;cursor:pointer;}
.keypad .kp-grid button:active{background:rgba(212,168,83,.3);}
.keypad .kp-grid .ok{background:var(--green-mid);color:#fff;}
.keypad .kp-grid .clr{background:rgba(192,57,43,.3);}
/* 觸控目標放大：原本 18px 純文字的「關閉」在觸控螢幕上很難按中 */
.keypad .kp-close{margin-top:16px;padding:14px 46px;font-family:inherit;font-size:23px;font-weight:700;color:var(--cream);background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:14px;cursor:pointer;}
.keypad .kp-close:active{background:rgba(255,255,255,.18);}
/* 右上角 X：常見的關閉位置，手指從螢幕邊緣過來最快 */
.kp-x{position:absolute;top:10px;right:10px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;font-weight:700;color:var(--cream);background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:14px;cursor:pointer;}
.kp-x:active{background:rgba(192,57,43,.45);}
/* 領票單（列印） */
#receipt{display:none;}
@media print{
  html,body{width:auto;height:auto;background:#fff;overflow:visible;}
  .screen{display:none!important;}
  #receipt{display:block!important;color:#000;width:72mm;margin:0 auto;text-align:center;font-family:'Noto Serif TC',serif;}
  #receipt .rk{font-size:11px;letter-spacing:.2em;color:#333;}
  #receipt .rt{font-size:17px;font-weight:900;margin:3px 0;}
  #receipt .rd{font-size:10px;color:#555;margin-bottom:8px;}
  #receipt .rqr{display:flex;justify-content:center;margin:6px 0;}
  #receipt .rqr img,#receipt .rqr canvas{width:52mm!important;height:52mm!important;}
  #receipt .rname{font-size:20px;font-weight:900;margin-top:4px;}
  #receipt .rno{font-size:12px;color:#333;}
  #receipt .rcands{margin-top:8px;border-top:1px dashed #999;padding-top:6px;text-align:left;}
  #receipt .rc-h{font-size:11px;font-weight:900;color:#000;margin:6px 0 3px;text-align:center;letter-spacing:.1em;}
  #receipt .rc-row{display:flex;align-items:baseline;gap:5px;font-size:11px;line-height:1.65;color:#111;}
  #receipt .rc-no{display:inline-block;min-width:16px;text-align:right;font-weight:900;}
  #receipt .rc-nm{font-weight:700;}
  #receipt .rc-co{color:#555;font-size:9px;}
  #receipt .rslip{page-break-after:always;}
  #receipt .rslip:last-child{page-break-after:auto;}
  #receipt .rproxy{font-size:12px;font-weight:900;color:#000;margin:4px 0;border:1.5px solid #000;border-radius:5px;padding:3px 6px;}
  @page{size:80mm auto;margin:3mm;}
}
</style>
</head>
<body>
<div class="bar"></div>
<div class="screen">
  <div class="top">
    <div><div class="t-kick">TADA 理監事選舉 · 報到領票</div><div class="t-title" id="e-title">—</div></div>
    <button class="t-status" onclick="openStatus()" aria-label="機台狀態">狀態</button>
  </div>
  <div class="main">
    <div class="toast" id="toast"></div>

    <!-- 待機：① 加入 LINE　② 出示會員證報到碼 -->
    <div class="view on" id="v-idle">
      <div class="idle-grid">
        <div class="idle-col">
          <div class="step">STEP 1</div>
          <div class="idle-h">加入 TADA LINE</div>
          <div class="oa-qr" id="oa-qr"><img src="../assets/line/oa-qr.png" alt="加入 TADA LINE 官方帳號"></div>
          <div class="idle-p">手機掃描加入官方帳號<br>領票、投票、活動通知都在這裡</div>
          <!-- 報到統計放在 QR 下方：頂列空出來，右邊的輸入面板才放得大 -->
          <div class="prog-box">
            <b id="p-checked">0</b><span>已報到 ／ <span id="p-total">0</span> 人</span>
          </div>
        </div>
        <div class="idle-div"></div>
        <div class="idle-col">
          <div class="step">STEP 2</div>
          <div class="idle-h">出示會員證報到碼</div>
          <div class="scan-ic" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <!-- 取景框四角 -->
              <g fill="none" stroke="#d4a853" stroke-width="6" stroke-linecap="round">
                <path d="M8 28 V15 a7 7 0 0 1 7-7 H28"/>
                <path d="M72 8 H85 a7 7 0 0 1 7 7 V28"/>
                <path d="M92 72 V85 a7 7 0 0 1 -7 7 H72"/>
                <path d="M28 92 H15 a7 7 0 0 1 -7 -7 V72"/>
              </g>
              <!-- QR 定位方塊 -->
              <g fill="none" stroke="#d4a853" stroke-width="5">
                <rect x="26" y="26" width="18" height="18" rx="3"/>
                <rect x="56" y="26" width="18" height="18" rx="3"/>
                <rect x="26" y="56" width="18" height="18" rx="3"/>
              </g>
              <g fill="#d4a853">
                <rect x="32.5" y="32.5" width="5" height="5"/>
                <rect x="62.5" y="32.5" width="5" height="5"/>
                <rect x="32.5" y="62.5" width="5" height="5"/>
                <rect x="56" y="56" width="7" height="7"/>
                <rect x="67" y="67" width="7" height="7"/>
                <rect x="58" y="69" width="5" height="5"/>
                <rect x="69" y="58" width="5" height="5"/>
              </g>
              <!-- 掃描線（上下呼吸掃動） -->
              <rect class="scan-line" x="14" y="0" width="72" height="3.5" rx="1.75" fill="#f5ecd4"/>
            </svg>
          </div>
          <div class="idle-p">打開 LINE 電子會員證，將報到碼對準掃描器<br>系統會顯示姓名並列印選票</div>
          <button class="kbd-btn" onclick="openKeypad()">⌨ 手動輸入會員編號</button>
        </div>
      </div>
    </div>

    <!-- 找到會員 -->
    <div class="view" id="v-found">
      <div id="found-ok" style="display:none;">
        <div class="welcome">歡迎報到</div>
        <div class="nm" id="f-name">—</div>
        <div class="no" id="f-no"></div>
        <div class="rep" id="f-rep"></div>
        <div class="rep" id="f-proxy" style="color:#e8b84b;font-weight:900;line-height:1.5;"></div>
        <div class="btn-row">
          <button class="big go" onclick="confirmCheckin()">🎫 領電子票<br><span style="font-size:16px;font-weight:400;">手機掃描投票</span></button>
          <button class="big go" style="background:linear-gradient(180deg,#b8913a,#8a6d28);" onclick="confirmCheckinPaper()">📄 領紙本票<br><span style="font-size:16px;font-weight:400;">現場圈選投票</span></button>
        </div>
        <div class="btn-row" style="margin-top:16px;"><button class="big cancel" onclick="toIdle()">✕ 取消</button></div>
      </div>
      <div id="found-done" style="display:none;">

<!-- 列印版面（螢幕隱藏，僅列印時顯示）；多張票時每張各一頁 -->
<div id="receipt"><div id="rz-slips"></div></div>

<script>
const VOTE_BASE = 'https://tada-ai.org.tw/vote/';
// TADA LINE 官方帳號「加好友」連結（基本 ID @tada-ai）
const LINE_OA_ADD_URL = 'https://line.me/R/ti/p/@tada-ai';
let election = null, current = null, state = 'idle';
/* 掃描來源決定要不要再印一張報到單：
     M: → LINE 電子會員證，會員手上沒有紙本 → 照常列印
     P: → 預先列印的報到單，紙本已在會員手上 → 只完成報到，不重印
   兩種 QR 內容都是「前綴＋會員編號」，其餘處理完全相同。
   宣告需早於 toIdle()／printReceipt() 使用。 */
let scanSrc = 'card';

function renderOaQr(){ /* 使用官方 QR 圖片（assets/line/oa-qr.png），毋須動態產生 */ }

function show(view){
  ['v-idle','v-found','v-print'].forEach(id=>document.getElementById(id).classList.toggle('on', id===view));
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), 2600);
}
async function rpc(fn, body){
  const r=await fetch(`${window.TADA_SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:window.tadaSbHeaders(),body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}

async function loadElection(){
  const r=await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_election?status=in.(checkin,open)&order=created_at.desc&limit=1`,{headers:window.tadaSbHeaders()});
  const list=r.ok?await r.json():[];
  if(!list.length){ document.getElementById('e-title').textContent='目前無開放報到的場次'; return; }
  election=list[0];
  document.getElementById('e-title').textContent=election.title;
  refreshProg(); setInterval(refreshProg, 10000);
  loadCandidates();
}

// 領票單上的候選人名單（一次載入、印在票券上供圈選參考）
async function loadCandidates(){
  try{
    const r=await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_candidates?election_id=eq.${election.id}&order=position.asc,sort.asc,no.asc`,{headers:window.tadaSbHeaders()});
    const cands=r.ok?await r.json():[];
    if(!cands.length) return;
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const block=(pos,label,seats)=>{
      const list=cands.filter(c=>c.position===pos);
      if(!list.length) return '';
      const rows=list.map(c=>`<div class="rc-row"><span class="rc-no">${c.no}</span><span class="rc-nm">${esc(c.name)}</span>${c.company?`<span class="rc-co">${esc(c.company)}</span>`:''}</div>`).join('');
      return `<div class="rc-h">${label}候選人（應選 ${seats} 席）</div>${rows}`;
    };
    candsHTML =
      block('director','理事',election.director_seats||'') +
      block('supervisor','監事',election.supervisor_seats||'');
  }catch(e){}
}
let candsHTML = '';
async function refreshProg(){
  if(!election) return;
  try{ const p=await rpc('vote_progress',{p_election:election.id});
    document.getElementById('p-checked').textContent=p.checked_in;
    document.getElementById('p-total').textContent=p.total_members;
  }catch(e){}
}

// 查會員（不報到，只顯示是誰）
async function lookup(memberNo){
  if(!election){ toast('尚未開放報到'); return; }
  try{
    const url=`${window.TADA_SB_URL}/rest/v1/tada_v_members?election_id=eq.${election.id}&member_no=eq.${encodeURIComponent(memberNo)}&select=member_no,name,member_type,rep,is_checked_in&limit=1`;
    const r=await fetch(url,{headers:window.tadaSbHeaders()});
    const arr=r.ok?await r.json():[];
    if(!arr.length){ toast('查無會員編號 '+memberNo); return; }
    current=arr[0];
    document.getElementById('found-ok').style.display   = current.is_checked_in?'none':'block';
    document.getElementById('found-done').style.display = current.is_checked_in?'block':'none';
    if(current.is_checked_in){
      document.getElementById('fd-name').textContent=current.name;
    }else{
      document.getElementById('f-name').textContent=current.name;
      document.getElementById('f-no').textContent='會員編號 '+current.member_no;
      document.getElementById('f-rep').textContent=(current.member_type==='group'&&current.rep)?('代表：'+current.rep):'';
      proxyPreview(current);
    }
    state='found'; show('v-found');
  }catch(e){ toast('系統忙碌，請重試'); }
}

// 查到會員時，預覽其委託狀態（供工作人員判讀）
async function proxyPreview(m){
  const el=document.getElementById('f-proxy'); if(!el) return; el.innerHTML='';
  try{
    const r=await rpc('proxy_mine',{p_election:election.id,p_user_id:'',p_name:m.name,p_no:m.member_no||''});
    const notes=[];
    if(r.is_delegate_for){ const s=[r.delegate_attend?'出席':null,r.delegate_vote?'投票':null].filter(Boolean).join('、'); notes.push('🤝 受 '+r.is_delegate_for+' 委託'+(s?'（'+s+'）':'')); }
    if(r.delegated && r.proxy_attend){ notes.push('⚠ 已委託 '+r.delegate_name+' 出席，本人免報到'); }
    else if(r.delegated && r.proxy_vote){ notes.push('ℹ 已委託 '+r.delegate_name+' 投票，本人不發選票'); }
    el.innerHTML=notes.join('<br>');
  }catch(e){}
}

// 確認 → 報到 → 產生 token → 列印
async function confirmCheckin(){
  if(!current) return;
  try{
    const res=await rpc('vote_checkin',{p_election:election.id,p_member_no:current.member_no});
    if(!res.ok){
      if(res.error==='already_checked_in') toast('此會員已報到領票');
      else if(res.error==='delegated_away') toast('此會員已將出席委託給 '+(res.delegate_name||'他人')+'，恕不重複報到');
      else toast('報到失敗：'+res.error);
      return;
    }
    markCheckinSource(current.member_no);
    printReceipt(res);
    refreshProg();
  }catch(e){ toast('報到失敗，請重試'); }
}

/* 報到來源：card=LINE電子會員證 / slip=預先列印小白單 / staff=服務人員手機產生 / manual=本機輸入。
   RPC 簽章不動，報到成功後直接補寫欄位；欄位尚未建立時靜默略過，不影響報到。 */
async function markCheckinSource(memberNo){
  if(!election||!memberNo) return;
  try{
    await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_members?election_id=eq.${election.id}&member_no=eq.${encodeURIComponent(memberNo)}`,
      {method:'PATCH',headers:{...window.tadaSbHeaders(),'Content-Type':'application/json'},
       body:JSON.stringify({checkin_source:scanSrc})});
  }catch(_){}
}

// 領紙本票：標記已報到（不發電子票），顯示應圈張數，開啟紙本選票列印
async function confirmCheckinPaper(){
  if(!current) return;
  try{
    const res=await rpc('vote_checkin_paper',{p_election:election.id,p_member_no:current.member_no});
    if(!res.ok){
      if(res.error==='already_checked_in') toast('此會員已報到');
      else if(res.error==='delegated_away') toast('此會員已將出席委託給 '+(res.delegate_name||'他人')+'，恕不重複報到');
      else toast('報到失敗：'+res.error);
      return;
    }
    markCheckinSource(current.member_no);
    const ballots = res.ballots||1;
    document.getElementById('pr-ic').style.display='none';
    document.getElementById('pr-qr-wrap').style.display='none';
    document.getElementById('pr-name').textContent = res.name+' 已領紙本票';
    let tip = scanSrc==='slip'
      ? '請持手上的預先列印報到單至圈選區領取紙本選票'
      : '請至圈選區以紙本圈選投票';
    if(ballots>1) tip = '共 '+ballots+' 張（含代理票）· '+tip;
    if(res.attend_rep>0) tip += '（另代表 '+res.attend_rep+' 人出席）';
    document.getElementById('pr-tip').textContent = tip;
    state='print'; show('v-print');
    agentPrint(res);   // 小白單（含條碼）；實體選票由服務台刷條碼核發，不再彈 A4 列印視窗
    setTimeout(()=>{ toIdle(); }, IDLE_DELAY_MS);
    refreshProg();
  }catch(e){ toast('報到失敗，請重試'); }
}

/*
  無印表機模式：網址帶 ?noprint=1 就不送印，改成把選票 QR 留在螢幕上讓本人用手機掃。
  報到與選票 token 都已經寫進資料庫了，列印只是把同一個 QR 印到紙上而已——
  少了印表機不影響資料正確性，之後接上印表機把參數拿掉即可。
*/
const NO_PRINT = new URLSearchParams(location.search).get('noprint') === '1';
const IDLE_DELAY_MS = NO_PRINT ? 25000 : 6000;   // 螢幕掃碼需要比出紙更久

function printReceipt(res){
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const uuids = Array.isArray(res.uuids) && res.uuids.length ? res.uuids : (res.uuid?[res.uuid]:[]);
  const nameDisp = res.name+(res.member_type==='group'&&res.rep?'（'+res.rep+'）':'');
  const dt = new Date().toLocaleString('zh-TW',{hour12:false});
  const selfBallot = res.self_ballot!=null ? res.self_ballot : uuids.length;   // 舊回傳無此欄 → 全視為本人
  const hasProxy = (res.proxy_vote_count||0) > 0 || selfBallot===0;

  // 產生每一張選票（多張時各自一頁）
  const slips = document.getElementById('rz-slips');
  slips.innerHTML='';
  uuids.forEach((u,i)=>{
    const url=VOTE_BASE+'?t='+u;
    const isSelf = (selfBallot===1 && i===0);
    const tag = hasProxy ? `<div class="rproxy">${isSelf?'本人選票':'代理選票 · 受託投票'}</div>` : '';
    const div=document.createElement('div');
    div.className='rslip';
    div.innerHTML =
      `<div class="rk">TADA 理監事選舉</div>`+
      `<div class="rt">${esc(election.title)}</div>`+
      `<div class="rd">${dt}${uuids.length>1?`　第 ${i+1}/${uuids.length} 張`:''}</div>`+
      tag+
      `<div class="rqr"></div>`+
      `<div class="rname">${esc(nameDisp)}</div>`+
      `<div class="rno">會員編號 ${esc(res.member_no)}</div>`+
      `<div class="rcands">${candsHTML}</div>`+
      `<div class="rtip">請用您的 LINE 掃描上方 QR Code 進入投票（需本人 LINE 驗證）。<br>本票為匿名選票，恕不重發，請妥善保管。</div>`;
    slips.appendChild(div);
    new QRCode(div.querySelector('.rqr'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
  });

  // 螢幕提示
  const attendOnly = uuids.length===0;   // 僅出席（本人票已委託出去且未受託投票）
  let headline, tip;
  if(attendOnly){ headline=res.name+' 報到完成'; tip='您已將投票委託他人，本次僅完成出席報到'; }
  else if(uuids.length>1){ headline=res.name+' 報到完成 · 共 '+uuids.length+' 張選票'; tip=NO_PRINT?'代理票請由工作人員協助列印':'請至出票口領取 '+uuids.length+' 張選票（含代理票）'; }
  else { headline=NO_PRINT?(res.name+' 報到完成'):(res.name+' 的選票列印中…'); tip=NO_PRINT?'請用您的 LINE 掃描上方 QR Code 進入投票（需本人 LINE 驗證）':'請至出票口領取您的選票，用您的 LINE 掃描選票 QR 即可投票'; }
  if(res.attend_rep>0 && !attendOnly) tip += '（另代表 '+res.attend_rep+' 人出席）';
  if(scanSrc==='slip'){
    headline = res.name+' 報到完成';
    tip = '您手上的預先列印報到單即為憑證，請妥善保管並依單上桌號入座';
  }else if(scanSrc==='staff'){
    tip = '（服務人員協助報到）'+tip;
  }
  document.getElementById('pr-name').textContent = headline;
  document.getElementById('pr-tip').textContent = tip;
  document.getElementById('pr-ic').style.display = (NO_PRINT||attendOnly||scanSrc==='slip') ? 'none' : '';

  // 螢幕掃碼模式：僅單張時把 QR 放到螢幕上；多張或零張不適用
  const wrap = document.getElementById('pr-qr-wrap');
  const screenQR = NO_PRINT && uuids.length===1;
  wrap.style.display = screenQR ? 'block' : 'none';
  if(screenQR){
    document.getElementById('pr-qr').innerHTML='';
    new QRCode(document.getElementById('pr-qr'),{text:VOTE_BASE+'?t='+uuids[0],width:230,height:230,correctLevel:QRCode.CorrectLevel.M});
  }
  state='print'; show('v-print');
  agentPrint(res);   // 本機列印代理（TSP650II 直連）；失敗靜默、螢幕 QR 照常
  if(!NO_PRINT && uuids.length) setTimeout(()=>{ window.print(); }, 300);   // --kiosk-printing 會靜默送印
  setTimeout(()=>{ toIdle(); }, IDLE_DELAY_MS);
}

/*
  本機列印代理：樹莓派上的 print-agent.py（127.0.0.1:8043）直連 Star TSP650II，
  不經 CUPS。桌號依使用者決策「用姓名比對出席名單」：tada_rsvp.display_name。
  代理不存在（開發機）或印表機離線時 fetch 會失敗 → 靜默略過，不影響報到流程。
*/
const PRINT_AGENT = 'http://127.0.0.1:8043/print';
/* 一人一張小白單：姓名/大字會員編號/桌號/領取勾選清單/會員編號條碼。
   當天為「現場領實體票投票」→ 不印投票 QR，服務台刷條碼核發實體選票。 */
async function agentPrint(res){
  // 掃的是預先列印的報到單：紙本已在會員手上，只完成報到不重印，省紙也省等待
  if(scanSrc==='slip'){ return; }
  try{
    let table='';
    try{
      const q=await fetch(`${window.TADA_SB_URL}/rest/v1/tada_rsvp?select=table_no&display_name=eq.${encodeURIComponent(res.name)}&hidden=is.false&limit=1`,{headers:window.tadaSbHeaders()});
      const rows=q.ok?await q.json():[];
      table=(rows[0]&&rows[0].table_no)||'';
    }catch(_){}
    // 領取清單：名片/禮物人人有；選票=本人票未委託出去且有投票權；委託票=受託投票者
    const checklist=['名片','禮物'];
    if(res.self_ballot!==0 && res.can_vote!==false) checklist.push('選票');
    if((res.proxy_vote_count||0)>0) checklist.push('委託票');
    const hasBallot = checklist.includes('選票')||checklist.includes('委託票');
    // 備註：選票委託出去 → 註明受託人；新會員無投票權 → 註明
    let remark='';
    if(res.can_vote===false){ remark='※ 新會員本屆無投票權，歡迎領取禮物'; }
    else if(res.self_ballot===0){
      try{
        const pm=await rpc('proxy_mine',{p_election:election.id,p_user_id:'',p_name:res.name,p_no:res.member_no||''});
        if(pm&&pm.delegated&&pm.proxy_vote) remark='※ 選票已委託（'+(pm.delegate_name||'受託人')+'會員）';
      }catch(_){}
      if(!remark) remark='※ 選票已委託他人';
    }
    await fetch(PRINT_AGENT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:res.name, member_no:res.member_no, table_no:table,
      checklist, remark,
      notice:hasBallot?'⚠ 選票需在下午 3:30 前完成領取及投票':'',
      barcode:hasBallot?res.member_no:'',   // 不能領票的人不印條碼（條碼＝服務台發票憑證）
      title:'第六屆會員大會・報到',
      footer:'請持本單至服務台領取，並依桌號入座',
    })});
  }catch(_){ /* 無代理或印表機離線：不影響報到 */ }
}

function toIdle(){ current=null; scanSrc='card'; state='idle'; show('v-idle'); }

// ── 硬體 QR Reader（HID 鍵盤）：快速輸入 + Enter ─────────────
let scanBuf='', scanTimer=null;
document.addEventListener('keydown', e=>{
  if(state!=='idle' || document.getElementById('keypad').classList.contains('on')) return;
  if(e.key==='Enter'){ if(scanBuf){ handleScan(scanBuf); scanBuf=''; } return; }
  if(e.key.length===1){ scanBuf+=e.key; clearTimeout(scanTimer); scanTimer=setTimeout(()=>scanBuf='',250); }
});
function handleScan(raw){
  const t=(raw||'').trim();
  let no;
  // 前綴決定「怎麼報到的」：P=會前預印小白單、S=服務人員手機產生、M=LINE 電子會員證
  if(/^P:/i.test(t)){ scanSrc='slip'; no=t.slice(2); }
  else if(/^S:/i.test(t)){ scanSrc='staff'; no=t.slice(2); }
  else if(/^M:/i.test(t)){ scanSrc='card'; no=t.slice(2); }
  else { scanSrc='card'; const m=t.match(/(\d{6,10})/); no=m?m[1]:t; }
  lookup(no);
}

// ── 數字鍵盤（觸控備援）───────────────────────────────────
// 三種查詢方式：會員編號 / 統一編號 / 手機號碼。
// 統編是公開資訊，所以那條路徑多兩步（選代表 → 手機末 3 碼），
// 否則任何人查到公司統編就能冒領選票。
const KP_MODES = {
  no:     { hint:'請輸入會員編號',        max:10 },
  tax:    { hint:'請輸入公司統一編號（8 碼）', max:8  },
  mobile: { hint:'請輸入手機號碼',        max:10 },
};
let kpMode='no', kpVal='', kpStage='input', kpTax='', kpPickIdx=null;

function kpEl(id){ return document.getElementById(id); }
function kpSetDisplay(t){ kpEl('kp-display').textContent=t; }
function kpSetHint(t){ kpEl('kp-hint').textContent=t; }

function setKpMode(mode){
  kpMode=mode; kpStage='input'; kpVal=''; kpTax=''; kpPickIdx=null;
  ['no','tax','mobile'].forEach(m=>kpEl('tab-'+m).classList.toggle('on', m===mode));
  kpSetDisplay(''); kpSetHint(KP_MODES[mode].hint);
  kpEl('kp-pick').style.display='none';
  kpEl('kp-grid').style.display='';
}
function openKeypad(){ setKpMode('no'); kpEl('keypad').classList.add('on'); }
function closeKeypad(){ kpEl('keypad').classList.remove('on'); }
function kp(d){
  const max = kpStage==='last3' ? 3 : KP_MODES[kpMode].max;
  if(kpVal.length<max){ kpVal+=d; kpSetDisplay(kpVal); }
}
function kpClear(){ kpVal=''; kpSetDisplay(''); }

/** 呼叫 RPC；SQL 還沒執行時給明確訊息，不要讓人以為是查無此人 */
async function checkinRpc(fn, body){
  const r=await fetch(`${window.TADA_SB_URL}/rest/v1/rpc/${fn}`,
    {method:'POST',headers:window.tadaSbHeaders(),body:JSON.stringify(body)});
  if(r.status===404){ throw new Error('NOT_INSTALLED'); }
  if(!r.ok) throw new Error('HTTP '+r.status);

  return r.json();
}

async function kpOk(){
  if(!kpVal) return;

  try{
    if(kpMode==='no'){ scanSrc='manual'; closeKeypad(); lookup(kpVal); return; }

    if(kpMode==='mobile'){
      const res=await checkinRpc('member_by_mobile',{p_mobile:kpVal});
      if(!res.ok){ toast('查無此手機號碼的會員'); kpClear(); return; }
      scanSrc='manual'; closeKeypad(); lookup(res.member_no); return;
    }

    // ── 統一編號 ──
    if(kpStage==='input'){
      if(kpVal.length!==8){ toast('統一編號為 8 碼'); return; }
      const res=await checkinRpc('member_candidates_by_tax',{p_tax_id:kpVal});
      if(!res.ok){ toast('查無此統一編號的會員'); kpClear(); return; }
      kpTax=kpVal;
      renderCandidates(res.candidates);
      return;
    }
    if(kpStage==='last3'){
      if(kpVal.length!==3){ toast('請輸入手機末 3 碼'); return; }
      const res=await checkinRpc('member_verify_by_tax',
        {p_tax_id:kpTax, p_idx:kpPickIdx, p_last3:kpVal});
      if(!res.ok){ toast('手機末 3 碼不符'); kpClear(); return; }
      scanSrc='manual'; closeKeypad(); lookup(res.member_no); return;
    }
  }catch(e){
    toast(e.message==='NOT_INSTALLED'
      ? '此查詢方式尚未啟用（資料庫待更新）'
      : '系統忙碌，請重試');
  }
}

/** 列出可選的人。姓名遮蔽由資料庫端處理，前端拿不到完整姓名。 */
function renderCandidates(list){
  const box=kpEl('kp-pick');
  box.innerHTML = list.map(c=>
    `<button onclick="pickCandidate(${c.idx})">${c.masked}${c.company?`<small>${c.company}</small>`:''}</button>`
  ).join('');
  box.style.display='flex';
  kpEl('kp-grid').style.display='none';
  kpSetDisplay(''); kpSetHint('請選擇您的姓名');
}

function pickCandidate(idx){
  kpPickIdx=idx; kpStage='last3'; kpVal='';
  kpEl('kp-pick').style.display='none';
  kpEl('kp-grid').style.display='';
  kpSetDisplay(''); kpSetHint('請輸入手機末 3 碼');
}

// 把 1200×800 的畫布等比縮進實際螢幕，並置中
function fitToScreen(){
  if(!window.matchMedia('screen').matches) return;
  const k = Math.min(window.innerWidth/1200, window.innerHeight/720);
  const b = document.body;
  b.style.transform = `translate(${(window.innerWidth-1200*k)/2}px, ${(window.innerHeight-720*k)/2}px) scale(${k})`;
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

// ── 機台狀態（唯讀）──────────────────────────────────────
let lastOkAt = null, lastErrAt = null;

function openStatus(){ document.getElementById('statuspanel').classList.add('on'); refreshStatus(); }
/* ── Wi-Fi 設定：/wifi-scan 列表 → 點選 → 螢幕鍵盤 → /wifi-connect ── */
let wfPw='', wfTarget=null, wfShift=false, wfSaved=[];
function openWifi(){
  document.getElementById('statuspanel').classList.remove('on');
  document.getElementById('wifipanel').classList.add('on');
  wifiBackToList(); loadWifi();
}
function closeWifi(){ document.getElementById('wifipanel').classList.remove('on'); }
function wfMsg(t,ok){ const m=document.getElementById('wf-msg'); m.textContent=t||''; m.style.color=ok===false?'#ff8b7a':'var(--gold-light)'; }
function wifiBackToList(){
  document.getElementById('wf-view-pw').style.display='none';
  document.getElementById('wf-view-list').style.display='flex';
  wfPw=''; wfTarget=null; wfMsg('');
}
function sigBar(n){ return n>=70?'▂▄▆█':n>=50?'▂▄▆':n>=30?'▂▄':'▂'; }
async function loadWifi(){
  const box=document.getElementById('wf-list');
  box.innerHTML='<div style="color:var(--green-light);font-size:17px;padding:20px;">掃描中…（約 5 秒）</div>';
  try{
    const ac=new AbortController(); setTimeout(()=>ac.abort(),25000);
    const r=await fetch('http://127.0.0.1:8043/wifi-scan',{signal:ac.signal});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'掃描失敗');
    wfSaved=d.saved||[];
    if(!(d.networks||[]).length){ box.innerHTML='<div style="color:#ff8b7a;font-size:17px;padding:20px;">掃不到任何網路</div>'; return; }
    box.innerHTML=d.networks.map(n=>{
      const cur=n.ssid===d.current, saved=wfSaved.includes(n.ssid);
      return `<button class="wf-row" onclick="pickWifi('${n.ssid.replace(/'/g,"\\'")}',${n.secured})">
        <span class="sig">${sigBar(n.signal)}</span>
        <span class="nm">${n.ssid.replace(/</g,'&lt;')}${n.secured?' 🔒':''}</span>
        ${saved?'<span class="tag">已儲存</span>':''}${cur?'<span class="cur">✓ 使用中</span>':''}
      </button>`;
    }).join('');
  }catch(e){ box.innerHTML='<div style="color:#ff8b7a;font-size:17px;padding:20px;">掃描失敗：'+e.message+'</div>'; }
}
function pickWifi(ssid,secured){
  wfTarget=ssid;
  if(wfSaved.includes(ssid) || !secured){ wifiJoin(); return; }   // 已儲存/開放網路直接連
  wfPw=''; wfShift=false;
  document.getElementById('wf-ssid').textContent=ssid;
  document.getElementById('wf-view-list').style.display='none';
  document.getElementById('wf-view-pw').style.display='flex';
  renderKb(); renderPw();
}
function renderPw(){
  const b=document.getElementById('wf-pwbox');
  b.textContent=wfPw||'\u00a0';
}
const KB_ROWS=[
  ['1','2','3','4','5','6','7','8','9','0'],
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m'],
  ['!','@','#','$','%','&','*','-','_','.'],
];
function renderKb(){
  const kb=document.getElementById('wf-kb');
  kb.innerHTML=KB_ROWS.map((row,i)=>{
    let cells=row.map(k=>{
      const ch=wfShift&&/[a-z]/.test(k)?k.toUpperCase():k;
      return `<button onclick="kbKey('${ch==="'"?"\\'":ch}')">${ch}</button>`;
    }).join('');
    if(i===3) cells=`<button class="wide ${wfShift?'on':''}" onclick="kbShift()">⇧ 大寫</button>`+cells+`<button class="wide" onclick="kbBack()">⌫ 刪除</button>`;
    return `<div class="kbrow">${cells}</div>`;
  }).join('')+`<div class="kbrow"><button class="wide" onclick="kbClear()">清空</button><button class="space" onclick="kbKey(' ')">空　格</button></div>`;
}
function kbKey(ch){ if(wfPw.length<63){ wfPw+=ch; renderPw(); } }
function kbShift(){ wfShift=!wfShift; renderKb(); }
function kbBack(){ wfPw=wfPw.slice(0,-1); renderPw(); }
function kbClear(){ wfPw=''; renderPw(); }
async function wifiJoin(){
  if(!wfTarget) return;
  const btn=document.getElementById('wf-join'); btn.disabled=true;
  wfMsg('連線中…（最多 45 秒，期間網路會短暫切換）');
  let d=null;
  try{
    const ac=new AbortController(); setTimeout(()=>ac.abort(),50000);
    const r=await fetch('http://127.0.0.1:8043/wifi-connect',{method:'POST',signal:ac.signal,
      headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:wfTarget,psk:wfPw})});
    d=await r.json();
  }catch(_){ /* 切換網路瞬間回應可能斷掉，改用 /status 確認結果 */ }
  if(!d){
    try{ const s=await fetch('http://127.0.0.1:8043/status'); const st=await s.json();
      d={ok:st.ssid===wfTarget, ssid:st.ssid, info:'以現況判定'}; }catch(_){ d={ok:false, info:'無法確認結果'}; }
  }
  btn.disabled=false;
  if(d.ok){ wfMsg('✓ 已連線到 '+(d.ssid||wfTarget), true); setTimeout(()=>{ wifiBackToList(); loadWifi(); }, 1500); }
  else{ wfMsg('連線失敗：'+(d.info||d.error||'未知錯誤')+'（請確認密碼）', false); }
}

async function quitKiosk(){
  if(!confirm('關閉報到機畫面、回到樹莓派桌面？\n（要重新啟動報到機：桌面重開 Chromium 或整機重開機）')) return;
  try{ await fetch('http://127.0.0.1:8043/quit',{method:'POST'}); }catch(_){}
}
function closeStatus(){ document.getElementById('statuspanel').classList.remove('on'); }

function ago(t){
  if(!t) return '—';
  const s = Math.round((Date.now() - t) / 1000);
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.round(s/60) + ' 分鐘前';

  return Math.round(s/3600) + ' 小時前';
}

async function refreshStatus(){
  const list = document.getElementById('st-list');
  const row = (k, v, cls='') => `<dt>${k}</dt><dd class="${cls}">${v}</dd>`;
  list.innerHTML = row('查詢中…','');

  let prog=null, last=null, latency=null, err=null;
  const t0 = Date.now();
  try{
    prog = await rpc('checkin_progress', { p_election: election ? election.id : null });
    latency = Date.now() - t0;
    lastOkAt = Date.now();
    const r = await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_members?election_id=eq.${election.id}`
      + `&is_checked_in=eq.true&select=name,rep,check_in_time&order=check_in_time.desc&limit=1`,
      { headers: window.tadaSbHeaders() });
    if(r.ok){ last = (await r.json())[0] || null; }
  }catch(e){ err = e.message; lastErrAt = Date.now(); }

  // 機台本身的網路資訊：問本機列印代理（只有在樹莓派上開才有；一般電腦看不到屬正常）
  let agent=null;
  try{
    const ac=new AbortController(); setTimeout(()=>ac.abort(),4000);
    const ar=await fetch('http://127.0.0.1:8043/status',{signal:ac.signal});
    if(ar.ok) agent=await ar.json();
  }catch(_){}
  document.getElementById('st-quit').style.display = agent ? '' : 'none';
  document.getElementById('st-wifi').style.display = agent ? '' : 'none';

  const online = !err;
  list.innerHTML = [
    row('連線', online ? `正常（${latency} ms）` : '無法連線', online ? 'ok' : 'bad'),
    ...(agent ? [
      row('機台 IP', (agent.ips&&agent.ips.length) ? agent.ips.join('、') : '未取得'),
      row('Wi-Fi', agent.ssid || '未連線', agent.ssid ? 'ok' : 'bad'),
      row('印表機', agent.printer_ip ? `${agent.printer_ip}（${agent.reachable?'連線正常':'無回應'}）` : '未找到', agent.reachable ? 'ok' : 'bad'),
    ] : [ row('列印代理', '未連線（非報到機或代理未啟動）', 'bad') ]),
    row('場次', election ? `${election.title}` : '未載入'),
    row('會員報到', prog ? `${prog.members_checked} / ${prog.members_total}` : '—'),
    row('貴賓報到', prog ? `${prog.guests_checked} / ${prog.guests_total}` : '—'),
    row('待補建檔', prog ? `${prog.pending}` : '—'),
    row('最後一筆', last ? `${last.rep || last.name}　${new Date(last.check_in_time).toLocaleTimeString('zh-TW',{hour12:false})}` : '尚無'),
    row('最後成功連線', ago(lastOkAt)),
    row('列印', NO_PRINT ? '停用（螢幕出示 QR）' : '啟用'),
    row('機台時間', new Date().toLocaleString('zh-TW',{hour12:false})),
  ].join('');
}

renderOaQr();
loadElection();
</script>
