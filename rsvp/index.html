<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出席回覆｜TADA 台灣科技農企業發展協會 第六屆會員大會</title>
<meta name="description" content="TADA 台灣科技農企業發展協會 2026 第六屆會員大會出席回覆。">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../assets/liff-common.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a14;--gold:#b8913a;--gold-light:#d4a853;--green-deep:#1e3320;--green-mid:#2d5235;--green-light:#5a8a60;--cream:#f8f4ea;--line:#e5ddc8;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:0 0 40px;}
.top-bar{height:4px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px;}
.head{text-align:center;margin-bottom:22px;}
.kick{font-size:11px;letter-spacing:0.3em;color:var(--gold);font-weight:600;margin-bottom:6px;}
.title{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:900;color:var(--green-deep);line-height:1.35;}
.sub{font-size:12px;color:var(--green-light);margin-top:8px;line-height:1.7;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(30,51,32,0.05);}
.greet{font-size:14px;color:var(--ink);margin-bottom:18px;}
.greet b{color:var(--gold);}
.field{margin-bottom:18px;}
.label{font-size:13px;font-weight:700;color:var(--green-deep);margin-bottom:9px;display:block;}
.seg{display:flex;gap:10px;}
.seg button{flex:1;padding:13px;font-size:15px;font-family:inherit;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--green-light);border-radius:8px;cursor:pointer;transition:all .15s;}
.seg button.on-yes{border-color:var(--green-mid);background:var(--green-mid);color:#fff;}
.seg button.on-no{border-color:#c0392b;background:#c0392b;color:#fff;}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:8px;width:fit-content;overflow:hidden;}
.stepper button{width:46px;height:46px;font-size:22px;background:var(--cream);border:none;color:var(--green-deep);cursor:pointer;font-family:inherit;}
.stepper button:active{background:var(--line);}
.stepper input{width:60px;height:46px;text-align:center;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:17px;font-weight:700;color:var(--ink);font-family:inherit;}
.hint{font-size:11px;color:var(--green-light);margin-top:6px;}
input[type=text],textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;background:#fff;}
input[type=text]:focus,textarea:focus{border-color:var(--gold);}
textarea{resize:vertical;min-height:60px;}
.submit{width:100%;padding:15px;font-size:16px;font-weight:700;font-family:inherit;background:var(--green-deep);color:var(--gold-light);border:none;border-radius:8px;cursor:pointer;letter-spacing:0.1em;transition:opacity .15s;}
.submit:active{opacity:.85;}
.submit:disabled{opacity:.5;}
.attend-fields.hide{display:none;}
.state{text-align:center;padding:60px 20px;}
.state .ic{font-size:56px;margin-bottom:16px;}
.state .msg{font-size:16px;color:var(--green-deep);font-weight:700;line-height:1.7;}
.state .sub2{font-size:13px;color:var(--green-light);margin-top:10px;line-height:1.8;}
.loading{text-align:center;padding:80px 20px;color:var(--green-light);font-size:14px;}
.err{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);color:#c0392b;font-size:13px;padding:12px;border-radius:8px;margin-bottom:14px;line-height:1.6;}
.badge-edit{display:inline-block;font-size:11px;background:rgba(184,145,58,0.12);color:var(--gold);padding:3px 10px;border-radius:10px;margin-left:6px;}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="wrap">

  <div id="loading" class="loading">載入中… 🐝</div>

  <!-- 表單 -->
  <div id="form-view" style="display:none;">
    <div class="head">
      <div class="kick">第六屆會員大會・出席回覆</div>
      <div class="title">智耕傳承 農業新世代</div>
      <div class="sub">2026 年 9 月 4 日（五）｜臻愛婚宴會館 2F 風情雅典廳</div>
    </div>

    <div id="err-box"></div>

    <!-- 這頁預設只放一個入口：多數會員已由秘書處代登記，直接查桌次即可，
         不必再填一次表單（重填還會產生第二筆登記）。要新填的人由 /confirm/
         查無資料時導回 ?new=1。 -->
    <a href="/confirm/" id="cta-confirm" style="display:block;background:var(--green-deep,#1e3320);color:#faf6ea;
       text-decoration:none;border-radius:12px;padding:26px 22px;margin-bottom:18px;text-align:center;">
      <span style="display:block;font-size:40px;line-height:1;margin-bottom:10px;">🪑</span>
      <span style="display:block;font-family:'Noto Serif TC',serif;font-size:21px;font-weight:900;color:#d4a853;letter-spacing:.04em;">出席確認・查詢我的桌次</span>
      <span style="display:block;font-size:13px;color:rgba(255,255,255,.68);margin-top:10px;line-height:1.9;">
        查看您的座位與登記內容<br>可修改出席人數、素食份數或取消出席
      </span>
      <span style="display:inline-block;margin-top:16px;background:#d4a853;color:#1e3320;font-size:15px;font-weight:700;
        padding:11px 30px;border-radius:99px;letter-spacing:.06em;">立即查詢 ›</span>
    </a>

    <div class="card" id="form-card" style="display:none;">
      <div class="greet">回覆 9/4 大會出席　<span id="edit-badge"></span></div>

      <!-- 多數會員的回覆是秘書處代登記或用別台裝置填的，LINE 這邊比對不到，
           直接送出會變成第二筆。先讓本人用姓名查回原本那筆再修改。 -->
      <div id="lookup-box" style="display:none;background:#fdf8ec;border:1px solid #e6d29a;border-radius:8px;padding:12px 14px;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:#7a5c14;margin-bottom:8px;">已經回覆過了嗎？</div>
        <div style="font-size:12px;color:#8a6d2a;line-height:1.8;margin-bottom:10px;">
          若您先前用網頁填過、或由秘書處代為登記，請先查詢帶出原本的回覆再修改，<br>避免產生兩筆重複登記。
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" id="lk-name" placeholder="您的姓名" style="flex:1;min-width:120px;padding:10px;border:1.5px solid #e6d29a;border-radius:8px;font-family:inherit;font-size:14px;">
          <input type="tel" id="lk-mobile" placeholder="手機（同名時需要）" inputmode="tel" style="flex:1;min-width:120px;padding:10px;border:1.5px solid #e6d29a;border-radius:8px;font-family:inherit;font-size:14px;">
          <button type="button" onclick="lookupMine()" style="padding:10px 16px;background:#7a5c14;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;">查詢</button>
        </div>
        <div id="lk-msg" style="font-size:12px;margin-top:8px;line-height:1.7;"></div>
      </div>

      <div class="field">
        <label class="label">姓名 <span style="color:#c0392b;">*</span></label>
        <input type="text" id="rsvp-name" placeholder="請輸入您的姓名">
      </div>

      <div class="field">
        <label class="label">單位（必填）</label>
        <input type="text" id="rsvp-org" placeholder="公司／機構名稱">
      </div>

      <div class="field">
        <label class="label">職稱（必填）</label>
        <input type="text" id="rsvp-title" placeholder="例如：董事長、總經理">
      </div>

      <div class="field">
        <label class="label">手機（必填）</label>
        <input type="tel" id="rsvp-mobile" placeholder="09XX-XXX-XXX" inputmode="tel">
        <div class="hint">方便當天聯繫與製作桌卡</div>
      </div>

      <div class="field">
        <label class="label">是否出席</label>
        <div class="seg">
          <button type="button" id="btn-yes" onclick="setAttend(true)">✓ 會出席</button>
          <button type="button" id="btn-no" onclick="setAttend(false)">✕ 無法出席</button>
        </div>
      </div>

      <div class="attend-fields" id="attend-fields">
        <div class="field">
          <label class="label">出席人數（含本人與眷屬）</label>
          <div class="stepper">
            <button type="button" onclick="step('headcount',-1)">−</button>
            <input type="number" id="headcount" value="1" min="1" max="20" readonly>
            <button type="button" onclick="step('headcount',1)">＋</button>
          </div>
          <div class="hint">歡迎攜帶家族第二代共同出席 👨‍👩‍👧</div>
        </div>

        <div class="field">
          <label class="label">素食份數</label>
          <div class="stepper">
            <button type="button" onclick="step('vegetarian',-1)">−</button>
            <input type="number" id="vegetarian" value="0" min="0" max="20" readonly>
            <button type="button" onclick="step('vegetarian',1)">＋</button>
          </div>
          <div class="hint">出席者中需要素食的份數</div>
        </div>

        <div class="field">
          <label class="label">同行眷屬／二代姓名（選填）</label>
          <input type="text" id="companions" placeholder="例如：陳大明、陳小華">
        </div>
      </div>

      <div class="field">
        <label class="label">備註（選填）</label>
        <textarea id="note" placeholder="想告訴協會的話…"></textarea>
      </div>

      <button class="submit" id="submit-btn" onclick="submitRsvp()">送出回覆</button>
    </div>
  </div>

  <!-- 成功 -->
  <div id="done-view" class="state" style="display:none;">
    <div class="ic" id="done-ic">🎉</div>
    <div class="msg" id="done-msg"></div>
    <div class="sub2" id="done-sub"></div>
    <a id="done-confirm" href="/confirm/" style="display:none;margin-top:20px;text-decoration:none;
       background:#1e3320;color:#d4a853;border-radius:8px;padding:13px 22px;font-size:14px;font-weight:700;">
      🪑 查看我的桌次
    </a>
  </div>

</div>

<script>
// LIFF ID 與 Supabase 設定集中在 ../assets/liff-common.js
const LIFF_ID = window.TADA_LIFF_IDS.rsvp;
const SB_URL = window.TADA_SB_URL;
const SB_HEADERS = window.tadaSbHeaders();

let profile = null, userId = null, inClient = false;
let attending = true;
/* 送出時實際要更新的那一筆。多數會員的回覆掛在秘書處代登記的 user_id 上，
   若不指回原本那筆，upsert 會以 LINE 的 userId 新增第二筆，人數與餐數就重複算。 */
let targetUserId = null;

const digits = v => String(v||'').replace(/\D/g,'');
const nameKey = v => String(v||'').replace(/\s+/g,'');

function fillForm(r){
  if(r.display_name) document.getElementById('rsvp-name').value = r.display_name;
  document.getElementById('rsvp-org').value = r.org ?? '';
  document.getElementById('rsvp-title').value = r.title ?? '';
  document.getElementById('rsvp-mobile').value = r.mobile ?? '';
  setAttend(r.attending);
  document.getElementById('headcount').value = r.headcount ?? 1;
  document.getElementById('vegetarian').value = r.vegetarian ?? 0;
  document.getElementById('companions').value = r.companions ?? '';
  document.getElementById('note').value = r.note ?? '';
  targetUserId = r.user_id;
}

async function findByName(name){
  const q = `${SB_URL}/rest/v1/tada_rsvp?hidden=eq.false&display_name=eq.${encodeURIComponent(nameKey(name))}`;
  const res = await fetch(q, { headers: SB_HEADERS });
  return res.ok ? await res.json() : [];
}

/* 本人用姓名（同名時再加手機）查回原本的登記 */
async function lookupMine(){
  const msg = document.getElementById('lk-msg');
  const name = nameKey(document.getElementById('lk-name').value);
  const mob  = digits(document.getElementById('lk-mobile').value);
  if(name.length < 2){ msg.style.color='#c0392b'; msg.textContent='請輸入完整姓名'; return; }
  msg.style.color='#8a6d2a'; msg.textContent='查詢中…';
  try{
    let rows = await findByName(name);
    if(rows.length > 1 && mob) rows = rows.filter(r => digits(r.mobile).endsWith(mob.slice(-3)));
    if(!rows.length){
      msg.style.color='#c0392b';
      msg.textContent='查無這個姓名的回覆紀錄。若確定沒填過，請直接在下方填寫送出即可。';
      return;
    }
    if(rows.length > 1){
      msg.style.color='#c0392b';
      msg.textContent=`有 ${rows.length} 筆同名紀錄，請補填手機號碼再查一次。`;
      return;
    }
    fillForm(rows[0]);
    document.getElementById('edit-badge').innerHTML = '<span class="badge-edit">已帶出原本的回覆，可直接修改</span>';
    msg.style.color='#2d7a3a';
    msg.textContent='✓ 已帶出您先前的回覆，修改後按下方「送出回覆」即可更新（不會新增第二筆）。';
  }catch(e){ msg.style.color='#c0392b'; msg.textContent='查詢失敗：'+e.message; }
}
function getWebId(){
  let id = localStorage.getItem('tada_rsvp_webid');
  if(!id){ id = 'web-' + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)); localStorage.setItem('tada_rsvp_webid', id); }
  return id;
}

function showErr(msg){ document.getElementById('err-box').innerHTML = '<div class="err">'+msg+'</div>'; }

function setAttend(v){
  attending = v;
  document.getElementById('btn-yes').className = v ? 'on-yes' : '';
  document.getElementById('btn-no').className = v ? '' : 'on-no';
  document.getElementById('attend-fields').classList.toggle('hide', !v);
}

function step(id, d){
  const el = document.getElementById(id);
  const min = +el.min, max = +el.max;
  el.value = Math.max(min, Math.min(max, (+el.value) + d));
  // 出席人數不可小於素食份數的下限提示（不強制）
}

// ?new=1＝從「出席確認」查不到資料、要新填一筆的人
const NEW_MODE = new URLSearchParams(location.search).get('new') === '1';

async function init(){
  if(NEW_MODE){
    document.getElementById('form-card').style.display = '';
    document.getElementById('cta-confirm').style.display = 'none';
  }
  // 判斷來源：從 LINE 內開啟 → 帶暱稱；從網頁開啟 → 需自填姓名
  try{
    await liff.init({ liffId: LIFF_ID });
    inClient = liff.isInClient();
    if(inClient){
      profile = await liff.getProfile();
      userId = profile.userId;
      document.getElementById('rsvp-name').value = profile.displayName || '';
      // 已綁定會員 → 帶入真實姓名與公司（下方若有既有回覆會再覆蓋）
      try{
        const br = await fetch(`${SB_URL}/rest/v1/rpc/roster_bound`,{method:'POST',headers:SB_HEADERS,body:JSON.stringify({p_user_id:userId})});
        const b = br.ok ? await br.json() : null;
        if(b && b.bound){
          document.getElementById('rsvp-name').value = b.name;
          if(b.company) document.getElementById('rsvp-org').value = b.company;
        }
      }catch(e){}
    } else {
      userId = getWebId();   // 網頁模式：以瀏覽器識別碼記住這台裝置的回覆
    }
  } catch(e){
    userId = getWebId();     // LIFF 初始化失敗（多為從網頁開啟）→ 網頁模式
  }

  targetUserId = userId;
  // 讀取既有回覆（若有）→ 預填
  try{
    const res = await fetch(`${SB_URL}/rest/v1/tada_rsvp?hidden=eq.false&user_id=eq.${encodeURIComponent(userId)}`, { headers: SB_HEADERS });
    const rows = res.ok ? await res.json() : [];
    if(rows.length){
      fillForm(rows[0]);
      document.getElementById('edit-badge').innerHTML = '<span class="badge-edit">您已回覆過，可修改</span>';
    } else {
      setAttend(true);
      // 這個 user_id 沒有紀錄，但本人可能早就由秘書處代登記或用別台裝置填過。
      // 已綁定會員 → 用真實姓名自動比對；只有一筆才自動帶入，避免抓錯人。
      let auto = false;
      const nm = nameKey(document.getElementById('rsvp-name').value);
      if(inClient && nm.length >= 2){
        try{
          const hits = await findByName(nm);
          if(hits.length === 1){
            fillForm(hits[0]); auto = true;
            document.getElementById('edit-badge').innerHTML = '<span class="badge-edit">已帶出既有回覆，可修改</span>';
          }
        }catch(e){}
      }
      if(!auto){
        document.getElementById('lookup-box').style.display = '';
        document.getElementById('lk-name').value = nm;
      }
    }
  }catch(e){ setAttend(true); }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('form-view').style.display = 'block';
}

async function submitRsvp(){
  const name = document.getElementById('rsvp-name').value.trim();
  if(!name){ showErr('請輸入姓名'); return; }
  const orgV = document.getElementById('rsvp-org').value.trim();
  if(!orgV){ showErr('請輸入單位（公司／機構名稱）'); return; }
  const titleV = document.getElementById('rsvp-title').value.trim();
  if(!titleV){ showErr('請輸入職稱'); return; }
  const mobileV = document.getElementById('rsvp-mobile').value.trim();
  if(!mobileV){ showErr('請輸入手機號碼'); return; }
  if(!/^09\d{2}[- ]?\d{3}[- ]?\d{3}$/.test(mobileV)){ showErr('手機格式請用 09XX-XXX-XXX'); return; }
  if(!userId){ showErr('初始化尚未完成，請重新整理頁面。'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '送出中…';

  const payload = {
    user_id: userId,
    display_name: name,
    org: document.getElementById('rsvp-org').value.trim() || null,
    title: document.getElementById('rsvp-title').value.trim() || null,
    mobile: document.getElementById('rsvp-mobile').value.trim() || null,
    attending: attending,
    headcount: attending ? (+document.getElementById('headcount').value || 1) : 0,
    vegetarian: attending ? (+document.getElementById('vegetarian').value || 0) : 0,
    companions: document.getElementById('companions').value.trim() || null,
    note: document.getElementById('note').value.trim() || null,
    updated_at: new Date().toISOString(),
  };

  try{
    payload.user_id = targetUserId || userId;   // 指回原本那筆，避免新增重複登記
    const res = await fetch(`${SB_URL}/rest/v1/tada_rsvp?on_conflict=user_id`, {
      method: 'POST',
      headers: { ...SB_HEADERS, Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(payload),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()));

    document.getElementById('form-view').style.display = 'none';
    const cf=document.getElementById('done-confirm'); if(cf) cf.style.display='';
    const done = document.getElementById('done-view');
    if(attending){
      document.getElementById('done-ic').textContent = '🎉';
      document.getElementById('done-msg').textContent = '出席回覆已送出，感謝您！';
      document.getElementById('done-sub').innerHTML = `我們已收到 <b>${payload.headcount}</b> 位出席登記${payload.vegetarian?`（含 ${payload.vegetarian} 份素食）`:''}。<br>9/4 大會現場見 🌾`;
    } else {
      document.getElementById('done-ic').textContent = '🙏';
      document.getElementById('done-msg').textContent = '已收到您的回覆';
      document.getElementById('done-sub').innerHTML = '很遺憾這次無法與您相聚，期待下次再會 🌱';
    }
    done.style.display = 'block';
    if(inClient){ setTimeout(() => { try{ liff.closeWindow(); }catch(e){} }, 2600); }
  } catch(e){
    showErr('送出失敗：' + (e.message || e));
    btn.disabled = false; btn.textContent = '送出回覆';
  }
}

init();
</script>
<script>window.tadaBackLink && tadaBackLink();</script>
</body>
</html>
