<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green-deep:#1e3320;--green-mid:#2d5235;--gold:#b8913a;--gold-light:#d4a853;--cream:#f8f4ea;--ink:#1a1a14;--green-light:#5a8a60;}
html,body{width:2500px;height:1686px;overflow:hidden;}
.grid{width:2500px;height:1686px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;background:var(--green-deep);}
.cell{background:#fbf7ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;overflow:hidden;}
.cell.vote{background:var(--green-deep);}
.cell.info{background:var(--cream);}
.cell::before{content:'';position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.cell::after{content:'';position:absolute;inset:0;opacity:0.035;background-image:repeating-linear-gradient(45deg,var(--green-deep) 0,var(--green-deep) 2px,transparent 2px,transparent 22px);pointer-events:none;}
.ic{font-size:150px;line-height:1;}
.tw{font-family:'Noto Serif TC',serif;font-size:70px;font-weight:900;color:var(--green-deep);letter-spacing:6px;}
.en{font-family:'Noto Sans TC',sans-serif;font-size:26px;font-weight:500;letter-spacing:14px;color:var(--gold);text-indent:14px;}
.line{width:64px;height:4px;background:var(--gold);border-radius:2px;}
.cell.vote .tw{color:#fff;}
.cell.vote .en{color:var(--gold-light);}
.cell.vote .line{background:var(--gold-light);}
</style>
</head>
<body>
<div class="grid">
  <div class="cell vote"><div class="ic">🗳️</div><div class="tw">立即投票</div><div class="line"></div><div class="en">VOTE</div></div>
  <div class="cell vote"><div class="ic">📊</div><div class="tw">開票直播</div><div class="line"></div><div class="en">LIVE RESULT</div></div>
  <div class="cell vote"><div class="ic">🖋️</div><div class="tw">願任書</div><div class="line"></div><div class="en">CONSENT</div></div>
  <div class="cell svc"><div class="ic">📋</div><div class="tw">出席回覆</div><div class="line"></div><div class="en">RSVP</div></div>
  <div class="cell svc"><div class="ic">🪪</div><div class="tw" style="font-size:60px;letter-spacing:3px;">會員證·報到碼</div><div class="line"></div><div class="en">MEMBER PASS</div></div>
  <div class="cell svc"><div class="ic">🏦</div><div class="tw">繳費回報</div><div class="line"></div><div class="en">PAYMENT</div></div>
  <div class="cell info"><div class="ic">🌾</div><div class="tw">活動資訊</div><div class="line"></div><div class="en">EVENT</div></div>
  <div class="cell info"><div class="ic">📝</div><div class="tw">我要入會</div><div class="line"></div><div class="en">JOIN US</div></div>
  <div class="cell info"><div class="ic">📞</div><div class="tw">聯絡秘書</div><div class="line"></div><div class="en">CONTACT</div></div>
</div>
</body>
</html>
