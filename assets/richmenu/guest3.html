<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green-deep:#1e3320;--green-mid:#2d5235;--gold:#b8913a;--gold-light:#d4a853;--cream:#f8f4ea;--ink:#1a1a14;}
html,body{width:2500px;height:843px;overflow:hidden;}
.grid{width:2500px;height:843px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--green-deep);}
.cell{background:#fbf7ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;overflow:hidden;}
.cell::before{content:'';position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.cell::after{content:'';position:absolute;inset:0;opacity:0.035;background-image:repeating-linear-gradient(45deg,var(--green-deep) 0,var(--green-deep) 2px,transparent 2px,transparent 22px);pointer-events:none;}
.ic{font-size:170px;line-height:1;}
.tw{font-family:'Noto Serif TC',serif;font-size:84px;font-weight:900;color:var(--green-deep);letter-spacing:6px;}
.en{font-family:'Noto Sans TC',sans-serif;font-size:28px;font-weight:500;letter-spacing:13px;color:var(--gold);text-indent:13px;}
.line{width:72px;height:5px;background:var(--gold);border-radius:2px;}
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="ic">🌾</div><div class="tw">最新消息</div><div class="line"></div><div class="en">NEWS</div></div>
  <div class="cell"><div class="ic">📝</div><div class="tw">我要入會</div><div class="line"></div><div class="en">JOIN US</div></div>
  <div class="cell"><div class="ic">🏛️</div><div class="tw">會務相關</div><div class="line"></div><div class="en">SERVICES</div></div>
</div>
</body>
</html>
