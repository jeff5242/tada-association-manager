<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 報到機必備：Chromium 的 --disable-features=Translate 旗標擋不住翻譯列，只有這個 meta 有效 -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件列印｜TADA</title>
<script src="../assets/liff-common.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif TC',serif;background:#e8e8e0;color:#111;padding:20px 0;}
.toolbar{max-width:794px;margin:0 auto 16px;display:flex;gap:10px;justify-content:center;}
.btn{padding:12px 26px;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;border:none;border-radius:8px;cursor:pointer;}
.btn.print{background:#1e3320;color:#d4a853;}
.btn.back{background:#fff;color:#1e3320;border:1px solid #ccc;}
/* A4 紙 */
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:110px 96px;box-shadow:0 4px 24px rgba(0,0,0,.15);}
.doc-title{text-align:center;font-size:40px;font-weight:900;letter-spacing:24px;text-indent:24px;margin-bottom:70px;}
.body-txt{font-size:22px;line-height:3;text-align:justify;}
.body-txt .fill{display:inline-block;min-width:150px;border-bottom:1.5px solid #111;text-align:center;font-weight:700;padding:0 10px;}
.sign-block{margin-top:70px;font-size:21px;line-height:3.2;}
.sign-block .fill{display:inline-block;min-width:180px;border-bottom:1.5px solid #111;text-align:center;font-weight:700;padding:0 10px;}
.to{font-size:21px;margin:40px 0 10px;}
.org{font-size:22px;font-weight:700;letter-spacing:4px;}
.date{margin-top:56px;font-size:20px;text-align:center;letter-spacing:3px;}
.notes{margin-top:70px;font-size:15px;line-height:2.2;font-family:'Noto Sans TC',sans-serif;color:#333;border-top:1px solid #ccc;padding-top:18px;}
.notes b{color:#000;}
.loading,.err{max-width:794px;margin:60px auto;text-align:center;font-family:'Noto Sans TC',sans-serif;color:#555;}
/* 紙本圈選票 */
.ballot{padding:14px 0 24px;}
.ballot + .ballot{border-top:2px dashed #bbb;margin-top:30px;padding-top:34px;}
.b-org{text-align:center;font-size:20px;font-weight:700;letter-spacing:4px;}
.b-title{text-align:center;font-size:30px;font-weight:900;letter-spacing:8px;margin:8px 0 14px;}
.b-meta{text-align:center;font-size:16px;font-family:'Noto Sans TC',sans-serif;margin-bottom:16px;}
.b-meta b{font-size:19px;color:#000;}
.b-table{width:100%;border-collapse:collapse;font-size:18px;}
.b-table th,.b-table td{border:1.5px solid #333;padding:10px 8px;}
.b-table th{background:#f0efe8;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;}
.b-table td.mark,.b-table th.mark{width:64px;text-align:center;}
.b-table td.mark{font-size:26px;color:#333;}
.b-table td.no,.b-table th.no{width:64px;text-align:center;}
.b-table td.cn{font-weight:700;white-space:nowrap;}
.b-table td.co{color:#333;font-size:15px;font-family:'Noto Sans TC',sans-serif;}
.b-note{font-family:'Noto Sans TC',sans-serif;font-size:14px;line-height:1.9;color:#333;margin-top:16px;}
.b-seal{font-family:'Noto Sans TC',sans-serif;font-size:15px;margin-top:26px;text-align:right;color:#111;}
@media print{
  body{background:#fff;padding:0;}
  .toolbar{display:none;}
  .sheet{box-shadow:none;width:100%;min-height:auto;margin:0;padding:24mm 22mm;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>
<div class="toolbar">
  <button class="btn print" onclick="window.print()">🖨️ 列印 / 存為 PDF</button>
  <button class="btn back" onclick="history.length>1?history.back():window.close()">← 返回</button>
</div>
<div id="loading" class="loading">載入文件…</div>
<div id="sheet" class="sheet" style="display:none;"></div>

<script>
const params = new URLSearchParams(location.search);
const DOC = params.get('doc'), ID = params.get('id');
const ORG = '台灣科技農企業發展協會';

function rocDate(iso){
  const d = iso ? new Date(iso) : new Date();
  return `中華民國 ${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
}
function rocYear(iso){ const d = iso ? new Date(iso) : new Date(); return d.getFullYear()-1911; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function fetchRow(table, id){
  const r = await fetch(`${window.TADA_SB_URL}/rest/v1/${table}?id=eq.${id}&limit=1`, { headers: window.tadaSbHeaders() });
  const a = r.ok ? await r.json() : [];
  return a[0] || null;
}

async function render(){
  if(!DOC){ fail('缺少文件參數。'); return; }
  if(DOC!=='ballot' && !ID){ fail('缺少文件參數。'); return; }   // ballot 的場次 id 選填
  try{
    if(DOC==='consent'){
      const c = await fetchRow('tada_v_consent', ID);
      if(!c){ fail('查無此願任書。'); return; }
      const pos = {director:'理事',supervisor:'監事',executive:'常務理事'}[c.position]||c.position;
      const e = await fetchRow('tada_v_election', c.election_id);
      const meeting = e ? e.title : '';
      sheet(`
        <div class="doc-title">願 任 書</div>
        <div class="body-txt">本人　<span class="fill">${esc(c.name)}</span>　當選　${esc(ORG)}<br>
          ${esc(meeting)}　<span class="fill">${esc(pos)}</span>，茲同意擔任本職。</div>
        <div class="sign-block">願任人：<span class="fill">${esc(c.name)}</span>　　（簽章）</div>
        <div class="date">${rocDate(c.created_at)}</div>
      `);
    } else if(DOC==='proxy'){
      const p = await fetchRow('tada_v_proxy', ID);
      if(!p){ fail('查無此委託書。'); return; }
      sheet(`
        <div class="doc-title">代理出席委託書</div>
        <div class="body-txt">本人因故不克出席本會　<b>${rocYear(p.created_at)}年度會員大會暨${esc(p.meeting||'第六屆理監事改選')}</b>。<br>
          委　<span class="fill">${esc(p.delegate_name)}</span>　代表本人出席，履行本人權利義務。</div>
        <div class="to">此致</div>
        <div class="org">${esc(ORG)}</div>
        <div class="sign-block">
          委託人：<span class="fill">${esc(p.principal_name)}</span>　（簽章）<br>
          受委託人：<span class="fill">${esc(p.delegate_name)}</span>　（簽章）
        </div>
        <div class="date">${rocDate(p.created_at)}</div>
        <div class="notes">
          注意事項：<br>
          一、依內政部社會團體法規彙編—人民團體選舉罷免辦法第九條規定，<b>每一會員僅能受一會員（會員代表）之委託代表出席</b>。<br>
          二、夥伴會員及團體會員之代表人無法出席，可由同公司他人代表出席，不需填製委託書，但需出示證明文件。<br>
          三、請持本委託書於開會時向大會報到處報到。
        </div>
      `);
    } else if(DOC==='paymentconfirm'){
      const p = await fetchRow('tada_payments', ID);
      if(!p){ fail('查無此繳費紀錄。'); return; }
      const TYPE = { personal_new:'個人・新入會', group_new:'團體・新入會', personal_renew:'個人・續約', group_renew:'團體・續約' };
      const who = p.applicant_name || p.display_name || '';
      const amt = (p.amount||0).toLocaleString();
      const payDate = p.paid_date ? rocDate(p.paid_date).replace('中華民國','').trim() : '';
      sheet(`
        <div class="doc-title">繳費確認證明</div>
        <div class="body-txt">茲證明　<span class="fill">${esc(who)}</span>　已繳納本會${p.member_type?`（${esc(TYPE[p.member_type]||p.member_type)}）`:''}<br>
          會費　新臺幣　<span class="fill">${esc(amt)}</span>　元整，經核對入帳無誤，特此確認。</div>
        <div class="sign-block">
          繳費日期：<span class="fill">${esc(payDate||'—')}</span>${p.last5?`<br>匯款帳號後五碼：<span class="fill">${esc(p.last5)}</span>`:''}
        </div>
        <div class="to" style="margin-top:50px;">此致</div>
        <div class="org">${esc(who)}　台端</div>
        <div style="text-align:right;margin-top:50px;" class="org">${esc(ORG)}</div>
        <div class="date">${rocDate(p.confirmed_at || p.created_at)}</div>
      `);
    } else if(DOC==='ballot'){
      // id = 選舉場次 id（省略則抓開放中場次）；member = 會員編號（印在票上）；pos = director|supervisor（省略則兩張都印）
      let e = ID ? await fetchRow('tada_v_election', ID) : null;
      if(!e){
        const r = await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_election?status=in.(checkin,open)&order=created_at.desc&limit=1`, {headers:window.tadaSbHeaders()});
        e = (r.ok ? await r.json() : [])[0];
      }
      if(!e){ fail('查無選舉場次。'); return; }
      const memberNo = params.get('member') || '';
      const cr = await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_candidates?election_id=eq.${e.id}&order=position.desc,sort,no`, {headers:window.tadaSbHeaders()});
      const cands = cr.ok ? await cr.json() : [];
      const wantPos = params.get('pos');
      const defs = [
        {key:'director',   label:'理事', seats:e.director_seats,   reserve:e.director_reserve,   pick:e.director_pick},
        {key:'supervisor', label:'監事', seats:e.supervisor_seats, reserve:e.supervisor_reserve, pick:e.supervisor_pick},
      ].filter(p => !wantPos || p.key===wantPos);
      const html = defs.map(p=>{
        const list = cands.filter(c=>c.position===p.key);
        const rows = list.length
          ? list.map(c=>`<tr><td class="mark">○</td><td class="no">${c.no??''}</td><td class="cn">${esc(c.name)}</td><td class="co">${esc(c.company||'')}</td></tr>`).join('')
          : `<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">尚無候選人</td></tr>`;
        return `<div class="ballot">
          <div class="b-org">${esc(ORG)}</div>
          <div class="b-title">${rocYear()}年度　${esc(e.title)}<br>${p.label}選舉選票</div>
          <div class="b-meta">應選 <b>${p.seats}</b> 名${p.reserve?`（另候補 ${p.reserve} 名）`:''}　·　圈選上限 <b>${p.pick}</b> 名，超過即為廢票</div>
          <div style="font-family:'Noto Sans TC',sans-serif;font-size:15px;margin-bottom:10px;">紙本投票　·　會員編號：<span style="display:inline-block;min-width:130px;border-bottom:1.5px solid #111;text-align:center;font-weight:700;">${esc(memberNo)}</span></div>
          <table class="b-table"><thead><tr><th class="mark">圈選</th><th class="no">號次</th><th class="cn">候選人</th><th class="co">服務單位</th></tr></thead><tbody>${rows}</tbody></table>
          <div class="b-note">圈選須知：請於候選人前「○」框內蓋章或打「✓」。採連記法，圈選超過上限即為廢票。<br>本票為<b>紙本投票</b>；同一會員若另有線上投票，<b>以紙本為準</b>。</div>
          <div class="b-seal">選舉委員會蓋章：____________</div>
        </div>`;
      }).join('');
      sheet(html);
    } else { fail('未知的文件類型。'); }
  }catch(e){ fail('載入失敗：'+e.message); }
}
function sheet(html){
  document.getElementById('loading').style.display='none';
  const s = document.getElementById('sheet'); s.innerHTML = html; s.style.display='block';
}
function fail(m){ document.getElementById('loading').className='err'; document.getElementById('loading').textContent=m; }
render();
</script>
</body>
</html>
