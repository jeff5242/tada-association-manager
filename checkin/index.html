<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 報到機必備：Chromium 的 --disable-features=Translate 旗標擋不住翻譯列，只有這個 meta 有效 -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報到領票｜TADA 理監事選舉</title>
<script src="../assets/liff-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a14;--gold:#b8913a;--gold-light:#d4a853;--green-deep:#1e3320;--green-mid:#2d5235;--green-light:#5a8a60;--cream:#f8f4ea;--line:#e5ddc8;--red:#c0392b;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
.top-bar{height:5px;background:linear-gradient(90deg,var(--green-mid),var(--gold),var(--gold-light),var(--gold),var(--green-mid));}
.wrap{max-width:620px;margin:0 auto;padding:26px 20px 60px;}
.head{text-align:center;margin-bottom:18px;}
.kick{font-size:12px;letter-spacing:0.3em;color:var(--gold);font-weight:600;margin-bottom:6px;}
.title{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:900;color:var(--green-deep);line-height:1.35;}
.sub{font-size:13px;color:var(--green-light);margin-top:6px;}
.stat{display:flex;gap:10px;justify-content:center;margin:16px 0 22px;flex-wrap:wrap;}
.stat .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-align:center;min-width:96px;}
.stat .n{font-size:24px;font-weight:900;color:var(--green-deep);font-family:'Noto Serif TC',serif;}
.stat .l{font-size:11px;color:var(--green-light);margin-top:2px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 6px 20px rgba(30,51,32,0.05);}
.label{font-size:14px;font-weight:700;color:var(--green-deep);margin-bottom:10px;display:block;}
input[type=text]{width:100%;padding:16px;border:2px solid var(--line);border-radius:10px;font-family:inherit;font-size:22px;letter-spacing:0.05em;color:var(--ink);outline:none;text-align:center;}
input[type=text]:focus{border-color:var(--gold);}
.btn{width:100%;padding:17px;font-size:18px;font-weight:700;font-family:inherit;background:var(--green-deep);color:var(--gold-light);border:none;border-radius:10px;cursor:pointer;letter-spacing:0.12em;margin-top:14px;}
.btn:disabled{opacity:.5;}
.btn.ghost{background:#fff;color:var(--green-deep);border:2px solid var(--line);}
.err{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);color:var(--red);font-size:14px;padding:13px;border-radius:9px;margin-bottom:14px;line-height:1.6;text-align:center;}
.warnbar{background:rgba(184,145,58,0.12);border:1px solid rgba(184,145,58,.4);color:#7a5c17;font-size:12px;padding:10px 14px;border-radius:9px;margin-bottom:16px;line-height:1.6;text-align:center;}
/* 領票單 */
#receipt-wrap{display:none;}
.receipt{width:302px;margin:0 auto;background:#fff;border:1px dashed #999;border-radius:6px;padding:20px 18px 22px;text-align:center;color:#000;}
.receipt .rk{font-size:11px;letter-spacing:0.25em;color:#555;}
.receipt .rt{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:900;margin:4px 0 2px;}
.receipt .rd{font-size:11px;color:#555;margin-bottom:12px;}
.receipt .qr{display:flex;justify-content:center;margin:6px 0 12px;}
.receipt .qr img,.receipt .qr canvas{width:190px!important;height:190px!important;}
.receipt .rname{font-size:20px;font-weight:900;}
.receipt .rno{font-size:12px;color:#555;margin-top:2px;letter-spacing:.05em;}
.receipt .rtip{font-size:11px;color:#333;margin-top:12px;line-height:1.7;border-top:1px dashed #bbb;padding-top:10px;}
.result-name{text-align:center;font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;color:var(--green-deep);margin:4px 0 16px;}
.loading{text-align:center;padding:70px 20px;color:var(--green-light);}
@media print{
  body{background:#fff;}
  .top-bar,.head,.stat,#form-card,.actions,.warnbar{display:none!important;}
  .wrap{padding:0;}
  #receipt-wrap{display:block!important;}
  .receipt{border:none;width:100%;}
}
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="wrap">
  <div id="loading" class="loading">載入選舉場次…</div>

  <div id="main" style="display:none;">
    <div class="head">
      <div class="kick">TADA 選舉報到處</div>
      <div class="title" id="e-title">理監事改選</div>
      <div class="sub">輸入會員編號 → 系統核發匿名選票 → 列印 QR 領票單</div>
    </div>

    <div class="stat">
      <div class="box"><div class="n" id="s-checked">0</div><div class="l">已報到領票</div></div>
      <div class="box"><div class="n" id="s-total">0</div><div class="l">應到會員</div></div>
      <div class="box"><div class="n" id="s-cast">0</div><div class="l">已投票</div></div>
    </div>

    <div class="card" id="form-card">
      <div id="form-err"></div>
      <label class="label">會員編號</label>
      <input type="text" id="in-no" inputmode="numeric" placeholder="例如 10001" autocomplete="off">
      <button class="btn" id="go-btn" onclick="doCheckin()">報到並核發選票</button>
    </div>
  </div>

  <!-- 領票單（列印用） -->
  <div id="receipt-wrap">
    <div class="result-name" id="rz-hint"></div>
    <div class="receipt">
      <div class="rk">TADA 理監事選舉</div>
      <div class="rt" id="rz-title">選票領票單</div>
      <div class="rd" id="rz-date"></div>
      <div class="qr" id="rz-qr"></div>
      <div class="rname" id="rz-name"></div>
      <div class="rno" id="rz-no"></div>
      <div class="rtip">請用您的 LINE 掃描上方 QR Code 進入投票（需本人 LINE 驗證）。<br>本票為匿名選票，恕不重發，請妥善保管。</div>
    </div>
    <div class="actions" style="max-width:340px;margin:18px auto 0;">
      <button class="btn" onclick="window.print()">🖨️ 列印領票單</button>
      <button class="btn ghost" onclick="nextMember()">✓ 完成，下一位</button>
    </div>
  </div>
</div>

<script>
// 投票頁基底（掃 QR 後開啟的網址）
const VOTE_BASE = location.origin + '/vote/';
let election = null;

function showErr(m){ document.getElementById('form-err').innerHTML = m ? '<div class="err">'+m+'</div>' : ''; }

async function rpc(fn, body){
  const res = await fetch(`${window.TADA_SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST', headers: window.tadaSbHeaders(), body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()));
  return res.json();
}

async function loadElection(){
  const r = await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_election?status=in.(checkin,open)&order=created_at.desc&limit=1`, { headers: window.tadaSbHeaders() });
  const list = r.ok ? await r.json() : [];
  document.getElementById('loading').style.display='none';
  if(!list.length){
    document.getElementById('loading').style.display='block';
    document.getElementById('loading').textContent = '目前沒有開放報到的選舉場次。請至後臺將場次狀態切換為「報到中」或「投票中」。';
    return;
  }
  election = list[0];
  document.getElementById('e-title').textContent = election.title;
  document.getElementById('main').style.display='block';
  document.getElementById('in-no').focus();
  refreshStat();
  setInterval(refreshStat, 8000);
}

async function refreshStat(){
  try{
    const p = await rpc('vote_progress', { p_election: election.id });
    document.getElementById('s-checked').textContent = p.checked_in;
    document.getElementById('s-total').textContent = p.total_members;
    document.getElementById('s-cast').textContent = p.ballots_cast;
  }catch(e){}
}

/* 報到來源：本頁為工作人員手動輸入會員編號 → manual。
   card=LINE電子會員證、slip=預先列印小白單、staff=服務人員手機(/assist/)產生。
   欄位尚未建立時靜默略過，不影響報到。 */
async function markCheckinSource(no){
  if(!election||!no) return;
  try{
    await fetch(`${window.TADA_SB_URL}/rest/v1/tada_v_members?election_id=eq.${election.id}&member_no=eq.${encodeURIComponent(no)}`,
      {method:'PATCH',headers:{...window.tadaSbHeaders(),'Content-Type':'application/json'},
       body:JSON.stringify({checkin_source:'manual'})});
  }catch(_){}
}

async function doCheckin(){
  const no = document.getElementById('in-no').value.trim();
  if(!no){ showErr('請輸入會員編號'); return; }
  const btn = document.getElementById('go-btn'); btn.disabled=true; btn.textContent='核發中…';
  try{
    const res = await rpc('vote_checkin', { p_election: election.id, p_member_no: no });
    if(!res.ok){
      const map = {
        member_not_found:'查無此會員編號，請確認後重試。',
        already_checked_in:'⚠️ 此會員已完成報到領票'+(res.name?('（'+res.name+'）'):'')+'，不可重複領票。',
        not_open:'目前非報到／投票時間。',
        election_not_found:'找不到選舉場次。',
      };
      showErr(map[res.error] || ('報到失敗：'+res.error));
      btn.disabled=false; btn.textContent='報到並核發選票'; return;
    }
    markCheckinSource(no);
    showReceipt(res);
    refreshStat();
  }catch(e){
    showErr('系統錯誤：'+e.message);
    btn.disabled=false; btn.textContent='報到並核發選票';
  }
}

function showReceipt(res){
  const url = VOTE_BASE + '?t=' + res.uuid;
  document.getElementById('rz-qr').innerHTML = '';
  new QRCode(document.getElementById('rz-qr'), { text: url, width:190, height:190, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('rz-title').textContent = election.title;
  document.getElementById('rz-date').textContent = new Date().toLocaleString('zh-TW',{hour12:false});
  document.getElementById('rz-name').textContent = res.name + (res.member_type==='group' && res.rep ? '（'+res.rep+'）' : '');
  document.getElementById('rz-no').textContent = '會員編號 ' + res.member_no;
  document.getElementById('rz-hint').textContent = '✓ 已核發選票，請列印交付';
  document.getElementById('main').style.display='none';
  document.getElementById('receipt-wrap').style.display='block';
  window.scrollTo(0,0);
}

function nextMember(){
  document.getElementById('receipt-wrap').style.display='none';
  document.getElementById('main').style.display='block';
  const btn = document.getElementById('go-btn'); btn.disabled=false; btn.textContent='報到並核發選票';
  const inp = document.getElementById('in-no'); inp.value=''; inp.focus();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && document.getElementById('main').style.display!=='none'){ doCheckin(); }
});
loadElection();
</script>
</body>
</html>
